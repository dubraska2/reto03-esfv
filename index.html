/* ============================ TAB: REGULADOR/INVERSOR Y BANCO DE BATERÍAS (Reto 03) ============================ */
/* RF-25 a RF-36. Hereda sin reingreso los datos del Reto 01 (getInheritedData) y del
   Reto 02 (genState + computePanelConfig del panel seleccionado). Método de las sesiones
   8-10 (Messenger y Abtahi, 2017; Chaaban, AE 868; Dobos, 2014), tal como exige el TdR. */

function defaultRamaForAppType(appType){
  // RF-25: on-grid sin baterías = "sin almacenamiento"; off-grid e híbridos = "con almacenamiento".
  return appType==='on-grid' ? 'sin-almacenamiento' : 'con-almacenamiento';
}
// RF-23 extendido: si en "Generador FV" se eligió explícitamente el criterio
// "Con almacenamiento" o "Sin almacenamiento", esa elección manda sobre el valor
// por defecto que depende del tipo de aplicación (RF-25) — tanto para decidir qué
// rama abre por defecto la pestaña "Regulador/Baterías" como para decidir, dentro
// de la selección automática del panel/arreglo, cuál rama se prioriza.
function ramaSugerida(appType){
  if(genState && genState.criterioSeleccion==='conAlmacenamiento') return 'con-almacenamiento';
  if(genState && genState.criterioSeleccion==='sinAlmacenamiento') return 'sin-almacenamiento';
  return defaultRamaForAppType(appType);
}
// Coherencia física rama↔tipo de aplicación (evita ofrecer una rama que no tiene sentido
// para el tipo de sistema declarado en el Reto 01, en vez de dejarla elegible y luego
// mostrar que ningún equipo puede cumplir):
// - Off-grid: SIEMPRE lleva banco de baterías y NUNCA está conectado a la red → solo
//   "con almacenamiento" tiene sentido; "sin almacenamiento" (inversor de conexión a
//   red) se deshabilita.
// - On-grid: NUNCA lleva banco de baterías → solo "sin almacenamiento" tiene sentido;
//   "con almacenamiento" se deshabilita.
// - Híbrido on-grid: conectado a la red para suministrar Y para cargar las baterías —
//   tiene banco de baterías Y relación con la red, así que AMBAS ramas son físicamente
//   válidas (ninguna se deshabilita).
// - Híbrido off-grid: tiene banco de baterías que se puede cargar desde la red o desde
//   el generador, pero NO entrega energía a la red (no hay inyección) → igual que
//   off-grid, solo "con almacenamiento" tiene sentido; "sin almacenamiento" se deshabilita.
function casoPruebaActivo(){
  return !!(genState && genState.overrideCasoPrueba);
}
function ramaSinAlmacenamientoDeshabilitada(appType){
  return appType==='off-grid' || appType==='hibrido-offgrid';
}
function ramaConAlmacenamientoDeshabilitada(appType){
  return appType==='on-grid';
}
// Cualquier punto que fije bancState.rama la llama justo después, para que la rama
// deshabilitada para el tipo de aplicación actual nunca quede activa — sin importar si
// venía de una elección manual previa, de un proyecto cargado o de un cambio reciente
// de tipo de aplicación.
function aplicarRestriccionRamaPorAppType(){
  if(ramaSinAlmacenamientoDeshabilitada(state.appType) && bancState.rama==='sin-almacenamiento'){
    bancState.rama = 'con-almacenamiento';
    bancState.ramaManual = false;
  } else if(ramaConAlmacenamientoDeshabilitada(state.appType) && bancState.rama==='con-almacenamiento'){
    bancState.rama = 'sin-almacenamiento';
    bancState.ramaManual = false;
  }
}
function defaultFactorTemp(tAmbMin){
  // TdR sección 4: f_T = 1,0 con temperatura mínima de 18°C o más. Por debajo de 18°C se
  // aplica una derrota lineal simple de referencia (totalmente editable, no es un supuesto oculto).
  if(tAmbMin>=18) return 1.0;
  const t = Math.max(0, tAmbMin);
  return Math.max(0.80, 1.0 - (18-t)*(0.20/18));
}
// bancState.tensionBancoV es la tensión NOMINAL del sistema de CC (clase 12/24/48 V): con ella
// se calculan la corriente de salida del regulador y las corrientes de la tasa C, y se fija
// Ns = Vnominal / Vunidad (TdR §6: "corriente del regulador con 48 V nominales en ambas
// tecnologías"). La tensión REAL del banco es Ns × Vunidad (48 V con 4 AGM de 12 V; 51,2 V con
// una LFP de 51,2 V) y es la que se usa para Cn [Ah], la energía instalada y el arranque Vbat+5.
function defaultBankVoltageForBattery(bateria){
  // Unidades de 12 V se asocian por defecto a un sistema de 48 V (estándar off-grid); unidades
  // de mayor tensión se asocian a la clase nominal más cercana (25,6 V → 24 V; 51,2 V → 48 V).
  if(bateria.vUnidadV < 24) return 48;
  return [12,24,48].reduce((a,b)=> Math.abs(b-bateria.vUnidadV)<Math.abs(a-bateria.vUnidadV) ? b : a);
}
// Entradas del banco para evaluar una batería del catálogo que puede no ser la elegida: cada
// tecnología se dimensiona con su propio DoD de diseño de fábrica (AGM 50 %, LFP 80 %...).
// El DoD que el usuario escribió solo se aplica a la batería elegida, o a todas mientras se
// busca automáticamente una batería si el usuario lo fijó a mano.
function opcionesBancoPara(b, usarDodManualParaTodas){
  const usarDodUsuario = b.id===bancState.bateriaId || (usarDodManualParaTodas && bancState.dodManual);
  return {
    vBanco: bancState.tensionBancoManual ? bancState.tensionBancoV : defaultBankVoltageForBattery(b),
    dodDisenoPct: usarDodUsuario ? bancState.dodDisenoPct : b.dodDisenoPct,
  };
}
function seriePorCadena(vNominal, bateria){ return Math.max(1, Math.round(vNominal/bateria.vUnidadV)); }
// Tensión real del banco con la batería elegida (Ns × Vunidad); sin batería, la nominal.
function tensionBancoRealV(){
  const b = (window.CATALOGO_BATERIAS||[]).find(x=>x.id===bancState.bateriaId);
  return b ? seriePorCadena(bancState.tensionBancoV, b)*b.vUnidadV : bancState.tensionBancoV;
}
function newBancState(){
  const appType = state ? state.appType : 'off-grid';
  const tMin = genState ? genState.tAmbMin : 10;
  return {
    rama: ramaSugerida(appType),
    ramaManual: false,
    etaInversor: 0.90,
    dcAcMin: 1.0, dcAcMax: 1.3,
    autonomiaDias: 2,
    dodDisenoPct: 50,
    dodManual: false,
    factorTemp: defaultFactorTemp(tMin),
    tensionBancoV: 48,
    tensionBancoManual: false,
    bateriaId: null, seleccionBateriaAutomatica: true,
    reguladorId: null, seleccionReguladorAutomatica: true,
    inversorId: null, seleccionInversorAutomatica: true,
    // RF-34: ajuste aceptado del balance de cierre — {firma, npExtra, modsBalance} o null.
    ajusteBalance: null,
    // Mensaje corto que describe el último cambio aplicado por el botón "Ajustar
    // automáticamente" (RF-28/30/31 extendido) — null si no se ha pulsado o si el
    // estado ya cambió por otra vía (cambio de rama, panel, carga, etc.).
    ajusteMsg: null,
    // Si ni cambiar de equipo ni reconfigurar el arreglo encuentran una combinación
    // válida, este mensaje explica por qué (según el tipo de aplicación/rama activa)
    // en vez de dejar la pantalla simplemente en blanco.
    configuracionImposible: null,
  };
}
let bancState = newBancState();

// Caso de prueba estandarizado del Reto 03 (continúa el caso de Nazareth/Alta Guajira del
// Reto 02 con el generador ya validado: 4 módulos de 550 Wp en 4 serie x 1 paralelo, 2,20 kWp).
function activarCasoPruebaReto3(){
  activarCasoPrueba(); // Reto 02: Ed/P(h)/Pmax, lat/lon, PR, Vmax, Tmin/Top, área, ventana
  // Resuelve el recurso solar de forma síncrona (sin depender de la consulta a la API) para
  // que el caso de prueba quede completamente verificable sin conexión, igual que el resto
  // del modo de verificación: el caso local "uribia" fue calibrado para reproducir exactamente
  // el HSP anual (5,8) y del mes crítico (5,2) declarados en el documento de referencia.
  genState.recurso = localFallbackRecurso(genState.lat, genState.lon, 'Caso de prueba estandarizado (resuelto sin conexión).');
  genState.panelSeleccionadoId = 'ref-caso-prueba';
  genState.seleccionAutomatica = false;
  genState.panelNsExtra = 0; // el caso de prueba usa exactamente la cadena 4s1p declarada en el TdR
  bancState.rama = 'con-almacenamiento';
  bancState.ramaManual = true;
  bancState.etaInversor = 0.90;
  bancState.autonomiaDias = 2;
  bancState.factorTemp = 1.0;
  bancState.bateriaId = 'agm-generico';
  bancState.seleccionBateriaAutomatica = false;
  bancState.dodDisenoPct = 50;
  bancState.tensionBancoV = 48;
  bancState.tensionBancoManual = true;
  bancState.reguladorId = null; bancState.seleccionReguladorAutomatica = true;
  bancState.inversorId = null; bancState.seleccionInversorAutomatica = true;
  bancState.ajusteBalance = null;
}
function desactivarCasoPruebaReto3(){
  desactivarCasoPrueba();
  bancState = newBancState();
}

// Generador seleccionado en el Reto 02 (referencia comercial elegida, ya configurada en cadenas)
function getGeneradorSeleccionado(){
  const ppicoW = computePpicoW();
  const panel = (window.CATALOGO_PANELES||[]).find(p=>p.id===genState.panelSeleccionadoId);
  if(!panel || ppicoW==null) return null;
  const cfg = computePanelConfig(panel, ppicoW, genState.panelNsExtra||0);
  if(cfg.descartado) return null;
  return { panel, cfg, ppicoW };
}
// RF-34: cuando el usuario acepta el ajuste del balance de cierre, el Reto 03 trabaja con el
// generador del Reto 02 ampliado en cadenas completas en paralelo (mismo Ns, más Np), y TODO
// el componente (verificación de equipos, corrientes, banco, tasa C, recuperación, balance e
// informe) se recalcula con ese generador. El ajuste queda atado a la configuración del
// Reto 02 sobre la que se aceptó: si esa configuración cambia, el ajuste deja de aplicarse.
function firmaGenerador(gen){ return `${gen.panel.id}|${gen.cfg.ns}|${gen.cfg.np}`; }
function ampliarGenerador(gen, npExtra){
  const np = gen.cfg.np + npExtra;
  const totalModulos = gen.cfg.ns*np;
  const cfg = Object.assign({}, gen.cfg, {
    np, totalModulos,
    potenciaInstaladaW: totalModulos*gen.panel.pMax,
    corrienteArregloA: np*gen.panel.isc,
    corrienteDisenoA: 1.25*1.25*np*gen.panel.isc,
    areaOcupadaM2: totalModulos*gen.panel.areaM2,
  });
  return Object.assign({}, gen, { cfg, base: gen, npExtra });
}
function ajusteBalanceVigente(gen){
  const aj = bancState.ajusteBalance;
  return !!(gen && aj && bancState.rama==='con-almacenamiento' && aj.firma===firmaGenerador(gen));
}
function getGeneradorReto3(){
  const gen = getGeneradorSeleccionado();
  if(!ajusteBalanceVigente(gen)) return gen;
  return ampliarGenerador(gen, bancState.ajusteBalance.npExtra);
}
// Cadenas completas que hay que añadir para cubrir el mayor de los dos déficits (anual o mes crítico).
function npExtraParaBalance(gen, bal){
  const mods = Math.max(bal.modulosAdicionalesAnual||0, bal.modulosAdicionalesCritico||0);
  return Math.max(0, Math.ceil((gen.cfg.totalModulos+mods)/gen.cfg.ns) - gen.cfg.np);
}
function reabrirSeleccionEquiposReto3(){
  if(bancState.seleccionReguladorAutomatica) bancState.reguladorId = null;
  if(bancState.seleccionInversorAutomatica) bancState.inversorId = null;
}
function aceptarAjusteBalance(){
  const gen = getGeneradorSeleccionado();
  const bateria = (window.CATALOGO_BATERIAS||[]).find(b=>b.id===bancState.bateriaId);
  if(!gen || !bateria) return;
  const bal = computeBalanceCierre(gen, computeBancoBaterias(gen, bateria));
  const npExtra = npExtraParaBalance(gen, bal);
  if(npExtra<=0) return;
  bancState.ajusteBalance = {
    firma: firmaGenerador(gen), npExtra,
    modsBalance: Math.max(bal.modulosAdicionalesAnual||0, bal.modulosAdicionalesCritico||0),
  };
  reabrirSeleccionEquiposReto3();
}
function deshacerAjusteBalance(){
  bancState.ajusteBalance = null;
  reabrirSeleccionEquiposReto3();
}

/* --------------------------- RF-28: verificación de tensiones del arreglo --------------------- */
// tipo: 'regulador' (rama con almacenamiento) | 'inversor' (rama sin almacenamiento)
function computeVerificacionArreglo(gen, equipo, tipo){
  const cfg = gen.cfg;
  const beta = Math.abs(cfg.panel.betaVocPct)/100; // |β| en 1/°C
  const ns = cfg.ns;
  const vocFrioV = cfg.vocTotalStringV;                                    // Voc·[1+|β|·(25-Tmin)]·Ns
  const vmpCalienteV = cfg.panel.vmp * (1 - beta*(cfg.tCelda-25)) * ns;     // Vmp·[1-|β|·(Tc-25)]·Ns
  const vmpFrioV = cfg.panel.vmp * (1 + beta*(25-genState.tAmbMin)) * ns;  // Vmp·[1+|β|·(25-Tmin)]·Ns

  const vocMaxEquipo = equipo.vocMaxV;
  const cumpleVocMax = vocFrioV <= vocMaxEquipo;

  let ventanaMinV, ventanaMaxV, origenVentana;
  if(tipo==='regulador'){
    // El regulador no publica ventana MPPT propia en el TdR (sección 6): el límite inferior
    // es el arranque (V_banco + 5 V, RF-28) y el superior la propia tensión máxima de entrada.
    ventanaMinV = tensionBancoRealV() + 5;
    ventanaMaxV = vocMaxEquipo;
    origenVentana = `arranque = V_banco + 5 V`;
  } else {
    ventanaMinV = equipo.ventanaMpptMinV;
    ventanaMaxV = equipo.ventanaMpptMaxV;
    origenVentana = `ventana MPPT del fabricante`;
  }
  const cumpleVentanaMin = vmpCalienteV >= ventanaMinV;
  const cumpleVentanaMax = vmpFrioV <= ventanaMaxV;
  const nsMaxEquipo = Math.floor(vocMaxEquipo / cfg.vocFrio);

  return {
    vocFrioV, vmpCalienteV, vmpFrioV, vocMaxEquipo, ventanaMinV, ventanaMaxV, origenVentana,
    cumpleVocMax, cumpleVentanaMin, cumpleVentanaMax,
    nsMaxEquipo, nsUsado: ns,
    cumpleTension: cumpleVocMax && cumpleVentanaMin && cumpleVentanaMax,
  };
}

/* --------------------------- RF-29: verificación de corrientes -------------------------------- */
function computeVerificacionCorrientes(gen, equipo, tipo){
  const cfg = gen.cfg;
  // Corriente de salida al banco = Ppico instalada / Vnominal del banco — SIN el factor 1,25
  // (ese factor es para conductores y protecciones, NTC 2050 art. 690-8, no para la capacidad
  // del regulador, tal como lo aclara explícitamente el TdR del Reto 03).
  const iSalidaBancoA = cfg.potenciaInstaladaW / bancState.tensionBancoV;
  const iscGeneradorA = cfg.corrienteArregloA;       // Np x Isc_módulo
  // RF-29: corriente de diseño de conductores con el factor 1,25 del TdR (NTC 2050 art. 690-8).
  // El Reto 02 reporta además 1,25 × 1,25 × Isc (con el factor de servicio continuo).
  const iDisenoConductoresA = 1.25*iscGeneradorA;
  const impGeneradorA = cfg.panel.imp * cfg.np;

  if(tipo==='regulador'){
    const cumpleSalida = iSalidaBancoA <= equipo.iSalidaBancoA;
    const cumpleIsc = iscGeneradorA <= equipo.iscMaxA;
    return { iSalidaBancoA, iDisenoConductoresA, iscGeneradorA, impGeneradorA,
      cumpleSalida, cumpleIsc, cumpleCorriente: cumpleSalida && cumpleIsc };
  }
  const cumpleImp = impGeneradorA <= equipo.impMaxA;
  const cumpleIsc = iscGeneradorA <= equipo.iscMaxA;
  return { iSalidaBancoA, iDisenoConductoresA, iscGeneradorA, impGeneradorA,
    cumpleImp, cumpleIsc, cumpleCorriente: cumpleImp && cumpleIsc };
}

/* --------------------------- RF-30: relación DC/AC (rama sin almacenamiento) ------------------- */
function computeDCAC(gen, inversor){
  const ratio = gen.cfg.potenciaInstaladaW / inversor.pacW;
  const dentroDeRango = ratio >= bancState.dcAcMin && ratio <= bancState.dcAcMax;
  let alerta = null;
  if(ratio > bancState.dcAcMax) alerta = 'recorte esperado (clipping): la relación DC/AC supera el máximo configurado.';
  else if(ratio < bancState.dcAcMin) alerta = 'inversor sobredimensionado: la relación DC/AC está por debajo del mínimo configurado.';
  return { ratio, dentroDeRango, alerta };
}

/* --------------------------- RF-31: veredicto por equipo --------------------------------------- */
function veredictoBadge(v){
  if(v==='cumple') return '<span class="tag tag-ok">✓ Cumple</span>';
  if(v==='alerta') return '<span class="tag tag-warn">⚠ Alerta</span>';
  return '<span class="tag tag-fail">✕ No cumple</span>';
}
function evaluarRegulador(gen, equipo){
  const vArr = computeVerificacionArreglo(gen, equipo, 'regulador');
  const vCor = computeVerificacionCorrientes(gen, equipo, 'regulador');
  const fails = [];
  if(!vArr.cumpleVocMax) fails.push(`Voc en frío del arreglo (${fmt(vArr.vocFrioV,2)} V) supera la tensión máxima de entrada del equipo (${fmt(vArr.vocMaxEquipo,2)} V).`);
  if(!vArr.cumpleVentanaMin) fails.push(`Vmp en caliente (${fmt(vArr.vmpCalienteV,2)} V) no alcanza el umbral de arranque V_banco+5V (${fmt(vArr.ventanaMinV,2)} V).`);
  if(!vArr.cumpleVentanaMax) fails.push(`Vmp en frío (${fmt(vArr.vmpFrioV,2)} V) supera el máximo admisible (${fmt(vArr.ventanaMaxV,2)} V).`);
  if(!vCor.cumpleSalida) fails.push(`Corriente de salida al banco (${fmt(vCor.iSalidaBancoA,2)} A) supera la corriente nominal de salida del equipo (${fmt(equipo.iSalidaBancoA,2)} A).`);
  if(!vCor.cumpleIsc) fails.push(`Isc del generador (${fmt(vCor.iscGeneradorA,2)} A) supera la Isc máxima admisible del equipo (${fmt(equipo.iscMaxA,2)} A).`);
  // Tensiones de banco que admite el equipo según su ficha (p. ej. 12/24 V); sin el dato, cualquiera.
  const vNominal = bancState.tensionBancoV;
  const cumpleTensionBanco = !Array.isArray(equipo.tensionesBancoV) || equipo.tensionesBancoV.some(v=>Math.abs(v-vNominal)<0.5);
  if(!cumpleTensionBanco) fails.push(`El equipo solo admite bancos de ${equipo.tensionesBancoV.join('/')} V; el sistema es de ${fmt(vNominal,1)} V.`);
  const veredicto = fails.length ? 'no-cumple' : 'cumple';
  const sugerencia = veredicto!=='no-cumple' ? null
    : (!vArr.cumpleVocMax
        ? 'Reduce el número de módulos en serie (Ns) en el Reto 02 para bajar la Voc del arreglo, o elige un equipo con mayor tensión máxima de entrada.'
        : !cumpleTensionBanco
          ? 'Elige un equipo que admita la tensión nominal del sistema, o cambia la tensión nominal del sistema a una que admita este equipo.'
          : 'Elige un equipo con mayor capacidad de corriente de salida/Isc, o reconfigura las cadenas del Reto 02.');
  return { equipo, vArr, vCor, fails, veredicto, sugerencia, cumpleTensionBanco };
}
function evaluarInversor(gen, equipo){
  const vArr = computeVerificacionArreglo(gen, equipo, 'inversor');
  const vCor = computeVerificacionCorrientes(gen, equipo, 'inversor');
  const dcac = computeDCAC(gen, equipo);
  const fails = [];
  if(!vArr.cumpleVocMax) fails.push(`Voc en frío del arreglo (${fmt(vArr.vocFrioV,2)} V) supera la tensión máxima de entrada del equipo (${fmt(vArr.vocMaxEquipo,2)} V).`);
  if(!vArr.cumpleVentanaMin) fails.push(`Vmp en caliente (${fmt(vArr.vmpCalienteV,2)} V) está por debajo del mínimo de la ventana MPPT (${fmt(vArr.ventanaMinV,2)} V).`);
  if(!vArr.cumpleVentanaMax) fails.push(`Vmp en frío (${fmt(vArr.vmpFrioV,2)} V) supera el máximo de la ventana MPPT (${fmt(vArr.ventanaMaxV,2)} V).`);
  if(!vCor.cumpleImp) fails.push(`Imp del generador por entrada (${fmt(vCor.impGeneradorA,2)} A) supera la Imp máxima admisible del equipo (${fmt(equipo.impMaxA,2)} A).`);
  if(!vCor.cumpleIsc) fails.push(`Isc del generador por entrada (${fmt(vCor.iscGeneradorA,2)} A) supera la Isc máxima admisible del equipo (${fmt(equipo.iscMaxA,2)} A).`);
  let veredicto = fails.length ? 'no-cumple' : 'cumple';
  if(veredicto==='cumple' && !dcac.dentroDeRango) veredicto = 'alerta';
  const sugerencia = fails.length===0 ? null
    : (!vArr.cumpleVocMax
        ? 'Reduce el número de módulos en serie (Ns) en el Reto 02 para bajar la Voc del arreglo, o elige un equipo con mayor tensión máxima de entrada.'
        : 'Elige un equipo con mayor capacidad de corriente/tensión, o reconfigura las cadenas del Reto 02.');
  return { equipo, vArr, vCor, dcac, fails, veredicto, sugerencia };
}
// RF-31: reconfiguración concreta en cadenas del MISMO panel que el equipo sí admitiría.
// Recorre Ns = 1..Ns máx. (limitado por la Voc del equipo y por la tensión máxima del
// sistema del Reto 02) con Np = ⌈módulos necesarios / Ns⌉ —la misma regla de
// computePanelConfig—, y devuelve la que cumple con menos módulos (a igualdad, menor Ns).
function generadorConCadenas(gen, ns, np){
  const panel = gen.panel, totalModulos = ns*np;
  const cfg = Object.assign({}, gen.cfg, {
    ns, np, totalModulos,
    potenciaInstaladaW: totalModulos*panel.pMax,
    vocTotalStringV: ns*gen.cfg.vocFrio,
    corrienteArregloA: np*panel.isc,
    corrienteDisenoA: 1.25*1.25*np*panel.isc,
    areaOcupadaM2: totalModulos*panel.areaM2,
  });
  return Object.assign({}, gen, { cfg });
}
function reconfiguracionQueCumple(gen, equipo, tipo){
  const modulos = Math.max(1, Math.ceil(gen.ppicoW/gen.panel.pMax));
  const nsTope = Math.min(gen.cfg.nsMax, Math.floor(equipo.vocMaxV/gen.cfg.vocFrio));
  let mejor = null;
  for(let ns=1; ns<=nsTope; ns++){
    const np = Math.ceil(modulos/ns);
    if(ns===gen.cfg.ns && np===gen.cfg.np) continue;
    const cand = generadorConCadenas(gen, ns, np);
    const ev = tipo==='regulador' ? evaluarRegulador(cand, equipo) : evaluarInversor(cand, equipo);
    if(ev.veredicto!=='cumple') continue;
    if(!mejor || ns*np < mejor.ns*mejor.np) mejor = { ns, np, totalModulos: ns*np, potenciaW: cand.cfg.potenciaInstaladaW };
  }
  return mejor;
}
function renderReconfiguracion(gen, equipo, tipo, ev){
  // Solo tiene sentido si lo que falla es el arreglo (no la tensión de banco que admite el equipo)
  // y si el generador es el del Reto 02 sin ampliar por el balance de cierre.
  if(ev.cumpleTensionBanco===false || gen.base) return '';
  const r = reconfiguracionQueCumple(gen, equipo, tipo);
  if(!r) return `<br><em>Reconfiguración:</em> ninguna combinación serie-paralelo del panel ${escapeHtml(gen.panel.marca)} ${escapeHtml(gen.panel.modelo)} con ${Math.ceil(gen.ppicoW/gen.panel.pMax)} módulos o más cumple con este equipo; elige otro equipo.`;
  return `<br><em>Reconfiguración:</em> con este equipo cumple el arreglo <strong>${r.ns}s × ${r.np}p</strong> (${r.totalModulos} módulos, ${fmt(r.potenciaW/1000,2)} kWp) del mismo panel.
    <button class="btn btn-ghost btn-sm" style="margin-left:6px;" data-aplicar-reconfig="${tipo}|${equipo.id}|${r.ns}">Aplicar ${r.ns}s × ${r.np}p y elegir este equipo</button>`;
}
// Aplica la reconfiguración sugerida: fija Ns en el Reto 02 (vía panelNsExtra, que
// computePanelConfig suma al Ns base) y elige el equipo para el que se calculó.
function aplicarReconfiguracion(tipo, equipoId, ns){
  const gen = getGeneradorSeleccionado();
  if(!gen) return;
  genState.panelNsExtra = ns - gen.cfg.nsBase;
  genState.seleccionAutomatica = false; // fija panel y cadena: la selección automática del Reto 02 no la reemplaza
  bancState.ajusteBalance = null;
  if(tipo==='regulador'){ bancState.reguladorId = equipoId; bancState.seleccionReguladorAutomatica = false; }
  else { bancState.inversorId = equipoId; bancState.seleccionInversorAutomatica = false; }
  bancState.ajusteMsg = `Se reconfiguró el arreglo a ${ns} módulos en serie y se eligió "${nombreEquipo(tipo, equipoId)}".`;
  bancState.configuracionImposible = null;
}
function autoSelectReguladorId(gen){
  // Prioriza una referencia comercial real con veredicto "cumple" para el
  // arreglo actual; solo si ninguna comercial cumple se recurre a los
  // equipos genéricos del TdR (CTRL-A/B/C), para que la selección
  // automática siempre entregue una configuración completa y válida.
  const catalogo = window.CATALOGO_REGULADORES||[];
  const evaluar = (lista)=> lista.map(e=>({e, ev:evaluarRegulador(gen,e)})).filter(x=>x.ev.veredicto==='cumple');
  const comerciales = evaluar(catalogo.filter(e=>!e.esReferenciaNoComercial));
  const candidatos = comerciales.length ? comerciales : evaluar(catalogo);
  if(candidatos.length===0) return null;
  candidatos.sort((a,b)=> a.e.iSalidaBancoA - b.e.iSalidaBancoA); // menor excedente de corriente de salida
  return candidatos[0].e.id;
}
function autoSelectInversorId(gen){
  // Prioridad en 4 niveles, de mejor a peor: 1) comercial que "cumple"
  // estrictamente (no solo "alerta"); 2) genérico del TdR que "cumple";
  // 3) comercial en "alerta" (viable pero con relación DC/AC fuera de rango);
  // 4) genérico en "alerta". "cumple" siempre gana sobre "alerta" aunque eso
  // signifique recurrir a un genérico — así la selección automática no se
  // conforma con una "alerta" comercial cuando ya existe un equipo que cumple
  // de verdad con el arreglo actual (ver RF-23 extendido, prioridad de rama).
  const catalogo = window.CATALOGO_INVERSORES||[];
  const comerciales = catalogo.filter(e=>!e.esReferenciaNoComercial);
  const evaluar = (lista, soloCumple)=> lista
    .map(e=>({e, ev:evaluarInversor(gen,e)}))
    .filter(x=> soloCumple ? x.ev.veredicto==='cumple' : x.ev.veredicto!=='no-cumple');
  const pools = [
    evaluar(comerciales, true),
    evaluar(catalogo, true),
    evaluar(comerciales, false),
    evaluar(catalogo, false),
  ];
  const centro = (bancState.dcAcMin+bancState.dcAcMax)/2;
  for(const pool of pools){
    if(pool.length===0) continue;
    pool.sort((a,b)=> Math.abs(a.ev.dcac.ratio-centro) - Math.abs(b.ev.dcac.ratio-centro));
    return pool[0].e.id;
  }
  return null;
}

/* --------------------------- RF-32/RF-33: banco de baterías ------------------------------------ */
function computeBancoBaterias(gen, bateria, opts){
  const o = opts || {};
  const inh = getInheritedData();
  const edAC = inh.ed; // kWh/día — todas las cargas en CA alimentadas por el inversor (rama con almacenamiento)
  const etaInversor = o.etaInversor!=null ? o.etaInversor : bancState.etaInversor;
  const eCCWhDia = (edAC*1000) / etaInversor;                      // Energía diaria en CC [Wh/día]
  const dod = (o.dodDisenoPct!=null ? o.dodDisenoPct : bancState.dodDisenoPct)/100;
  const fT = o.factorTemp!=null ? o.factorTemp : bancState.factorTemp;
  const N = o.autonomiaDias!=null ? o.autonomiaDias : bancState.autonomiaDias;
  const vBanco = o.vBanco!=null ? o.vBanco : bancState.tensionBancoV; // tensión nominal del sistema
  const ns = seriePorCadena(vBanco, bateria);                        // baterías en serie por cadena
  const vBancoReal = ns*bateria.vUnidadV;                            // tensión real del banco
  const cnWh = (eCCWhDia*N)/(dod*fT);                               // Capacidad nominal del banco [Wh]
  const cnAh = cnWh/vBancoReal;                                     // Capacidad nominal del banco [Ah]
  const np = Math.max(1, Math.ceil(cnAh/bateria.cUnidadAh));        // cadenas en paralelo (unidades enteras)
  const numBaterias = ns*np;
  const ahInstalados = np*bateria.cUnidadAh;
  const eInstaladaWh = ahInstalados*vBancoReal;                     // Ah instalados x V del banco
  const kwhInstalados = eInstaladaWh/1000;
  const dodFinal = eInstaladaWh>0 ? (eCCWhDia*N)/eInstaladaWh : null;  // DoD real al final de la autonomía
  const dodDiario = eInstaladaWh>0 ? eCCWhDia/eInstaladaWh : null;
  const redondeoExcedeDod = dodFinal!=null && dodFinal > dod + 1e-9;
  return { bateria, eCCWhDia, dod, fT, N, vBanco, vBancoReal, cnWh, cnAh, ns, np, numBaterias,
    ahInstalados, eInstaladaWh, kwhInstalados, dodFinal, dodDiario, redondeoExcedeDod };
}
function autoSelectBateriaId(gen){
  // Prioriza, en este orden: 1) una referencia comercial real cuyo
  // redondeo serie-paralelo no supere el DoD de diseño ("cumple");
  // 2) cualquier referencia comercial real, si ninguna cumple ese criterio
  // con el generador actual; 3) las tecnologías genéricas del TdR, solo si
  // no hay ninguna referencia comercial disponible. Dentro de cada grupo
  // se conserva el criterio original: menor energía instalada (kWh) que
  // satisface la autonomía pedida.
  const catalogo = window.CATALOGO_BATERIAS||[];
  if(catalogo.length===0) return null;
  const evaluar = (b)=>{
    const cfg = computeBancoBaterias(gen, b, opcionesBancoPara(b, true));
    return { b, cfg, cumple: !cfg.redondeoExcedeDod };
  };
  const comerciales = catalogo.filter(b=>!b.esReferenciaNoComercial).map(evaluar);
  const pools = [
    comerciales.filter(x=>x.cumple),
    comerciales,
    catalogo.map(evaluar),
  ];
  for(const pool of pools){
    if(pool.length===0) continue;
    pool.sort((a,b)=>a.cfg.kwhInstalados-b.cfg.kwhInstalados);
    return pool[0].b.id;
  }
  return null;
}
// Variante de autoSelectBateriaId que, además del redondeo del DoD, exige que la
// tasa C de carga y de descarga de la batería (RF-35) también cumplan contra el
// arreglo/demanda actuales — para que el botón "Ajustar automáticamente" no deje
// una batería técnicamente "elegida" pero sobrecargada en corriente.
function elegirBateriaQueCumpleTasaC(gen){
  const catalogo = window.CATALOGO_BATERIAS||[];
  if(catalogo.length===0) return null;
  const evaluar = (b)=>{
    const cfg = computeBancoBaterias(gen, b, opcionesBancoPara(b, true));
    const tasaC = computeTasaC(gen, cfg);
    const cumple = !cfg.redondeoExcedeDod && tasaC.cumpleCarga!==false && tasaC.cumpleDescarga!==false;
    return { b, cfg, cumple };
  };
  const comerciales = catalogo.filter(b=>!b.esReferenciaNoComercial).map(evaluar);
  const todas = catalogo.map(evaluar);
  const pools = [ comerciales.filter(x=>x.cumple), todas.filter(x=>x.cumple), comerciales, todas ];
  for(const pool of pools){
    if(pool.length===0) continue;
    pool.sort((a,b)=>a.cfg.kwhInstalados-b.cfg.kwhInstalados);
    return pool[0].b.id;
  }
  return null;
}
function nombreEquipo(tipo, id){
  if(!id) return '—';
  const catalogo = tipo==='regulador' ? (window.CATALOGO_REGULADORES||[])
    : tipo==='inversor' ? (window.CATALOGO_INVERSORES||[])
    : (window.CATALOGO_BATERIAS||[]);
  const e = catalogo.find(x=>x.id===id);
  return e ? `${e.marca} ${e.modelo}` : id;
}
// RF-25/28/30/31/35 extendido: mensaje contextual cuando ni cambiar de equipo/batería
// ni reconfigurar el arreglo del Reto 02 logran una combinación válida para la rama
// activa, redactado según el tipo de aplicación declarado en el Reto 01 (sección 3 del
// TdR: off-grid e híbridos = con almacenamiento; on-grid = sin almacenamiento).
function mensajeConfiguracionImposible(esCon){
  const at = state.appType;
  const base = esCon
    ? 'ningún regulador MPPT del catálogo (ni ninguna batería disponible para él) admite el arreglo, ni siquiera ajustando el número de módulos en serie/paralelo dentro de los límites declarados (tensión máxima del sistema y área disponible)'
    : 'ningún inversor con entrada MPPT del catálogo admite el arreglo con veredicto "cumple", ni siquiera ajustando el número de módulos en serie/paralelo dentro de esos mismos límites';
  let nota = '';
  if(!esCon && at==='off-grid'){
    nota = ' Nota: un sistema off-grid siempre lleva banco de baterías y nunca está conectado a la red — esta rama no debería estar activa para este tipo de aplicación; revisa el selector de rama.';
  } else if(!esCon && at==='hibrido-offgrid'){
    nota = ' Nota: un sistema híbrido off-grid tiene banco de baterías y no entrega energía a la red — esta rama no debería estar activa para este tipo de aplicación; revisa el selector de rama.';
  } else if(esCon && at==='on-grid'){
    nota = ' Nota: un sistema on-grid no lleva banco de baterías — esta rama no debería estar activa para este tipo de aplicación; revisa el selector de rama. Si este proyecto sí necesita almacenamiento, decláralo como híbrido en la pestaña "Proyecto".';
  } else if(!esCon && at==='hibrido-ongrid'){
    nota = ' Revisa si la tensión máxima del sistema (Generador FV) es suficientemente alta para alcanzar la ventana MPPT de los inversores del catálogo.';
  } else if(esCon && at==='hibrido-ongrid'){
    nota = ' Revisa si la tensión máxima del sistema (Generador FV) deja un margen razonable sobre la tensión máxima de entrada de los reguladores del catálogo.';
  }
  return `❌ Configuración no posible: ${base}, con el tipo de aplicación actual (${APP_TYPE_LABELS[at]||at}).${nota} Para resolverlo: amplía el catálogo con un equipo de mayor rango de tensión/corriente, o relaja una restricción declarada (tensión máxima del sistema, área disponible).`;
}
// Botón "Ajustar automáticamente" (RF-28/30/31 extendido): si el equipo elegido —o
// cualquiera del catálogo— no cumple con el arreglo actual, primero intenta solo
// cambiar de equipo/batería (sin tocar el Reto 02); si ninguno del catálogo cumple
// con el arreglo vigente, reabre la selección automática del panel (misma búsqueda
// bidireccional de Ns que RF-19/20) apuntando específicamente a la rama ACTIVA, y
// vuelve a elegir equipo/batería sobre ese arreglo nuevo. Si tampoco así aparece una
// combinación válida, deja un mensaje explicando que no es posible con lo disponible.
function ajustarParaCumplir(){
  const ppicoW = computePpicoW();
  let gen = getGeneradorReto3(); // incluye el ajuste del balance de cierre, si fue aceptado
  if(!gen || ppicoW==null) return;
  const esCon = bancState.rama==='con-almacenamiento';
  const panelAntes = gen.panel, nsAntes = gen.cfg.ns, npAntes = gen.cfg.np;
  const reguladorAntes = bancState.reguladorId, inversorAntes = bancState.inversorId, bateriaAntes = bancState.bateriaId;
  const describirArreglo = (g)=> `${g.panel.marca} ${g.panel.modelo} (${g.cfg.ns}s × ${g.cfg.np}p, ${g.cfg.totalModulos} módulos)`;

  // Paso 1: con el MISMO arreglo, ¿hay un equipo (y una batería) del catálogo que cumplan?
  if(esCon){
    if(existeReguladorQueCumple(gen)){
      const nuevoReg = autoSelectReguladorId(gen);
      bancState.reguladorId = nuevoReg; bancState.seleccionReguladorAutomatica = true;
      const nuevoBat = elegirBateriaQueCumpleTasaC(gen) || autoSelectBateriaId(gen);
      if(nuevoBat){ bancState.bateriaId = nuevoBat; bancState.seleccionBateriaAutomatica = true; }
      bancState.configuracionImposible = null;
      const cambioReg = nuevoReg!==reguladorAntes, cambioBat = nuevoBat && nuevoBat!==bateriaAntes;
      bancState.ajusteMsg = (!cambioReg && !cambioBat)
        ? `El regulador "${nombreEquipo('regulador',nuevoReg)}" y la batería "${nombreEquipo('bateria',nuevoBat)}" ya cumplían con el arreglo actual (${describirArreglo(gen)}); no fue necesario ningún cambio.`
        : `Se ajustó el equipo sin tocar el arreglo de paneles (${describirArreglo(gen)}): `
          + [cambioReg?`regulador de "${nombreEquipo('regulador',reguladorAntes)}" a "${nombreEquipo('regulador',nuevoReg)}"`:null,
             cambioBat?`batería de "${nombreEquipo('bateria',bateriaAntes)}" a "${nombreEquipo('bateria',nuevoBat)}"`:null]
            .filter(Boolean).join('; ') + '.';
      return;
    }
  } else {
    const candidato = existeInversorQueCumple(gen) ? autoSelectInversorId(gen) : null;
    const ev0 = candidato ? evaluarInversor(gen, (window.CATALOGO_INVERSORES||[]).find(e=>e.id===candidato)) : null;
    if(ev0 && ev0.veredicto==='cumple'){
      bancState.inversorId = candidato; bancState.seleccionInversorAutomatica = true;
      bancState.configuracionImposible = null;
      bancState.ajusteMsg = (candidato===inversorAntes)
        ? `El inversor "${nombreEquipo('inversor',candidato)}" ya cumplía con el arreglo actual (${describirArreglo(gen)}); no fue necesario ningún cambio.`
        : `Se cambió el inversor de "${nombreEquipo('inversor',inversorAntes)}" a "${nombreEquipo('inversor',candidato)}" porque el nuevo cumple con el arreglo actual (${describirArreglo(gen)}); el arreglo de paneles no se modificó.`;
      return;
    }
  }

  // Paso 2: ningún equipo cumple con el arreglo vigente — se reconfigura el panel
  // (RF-19/20) apuntando a la rama ACTIVA, y se vuelve a elegir equipo/batería.
  const seleccionPanel = autoSelectPanelId(ppicoW, esCon ? 'con-almacenamiento' : 'sin-almacenamiento');
  if(seleccionPanel && seleccionPanel.viableObjetivo){
    genState.panelSeleccionadoId = seleccionPanel.id;
    genState.seleccionAutomatica = true;
    genState.panelNsExtra = seleccionPanel.nsExtra;
    bancState.ajusteBalance = null; // el arreglo cambió: el ajuste del balance ya no corresponde
    gen = getGeneradorSeleccionado();
    bancState.configuracionImposible = null;
    if(esCon){
      const nuevoReg = autoSelectReguladorId(gen);
      bancState.reguladorId = nuevoReg; bancState.seleccionReguladorAutomatica = true;
      const nuevoBat = elegirBateriaQueCumpleTasaC(gen) || autoSelectBateriaId(gen);
      if(nuevoBat){ bancState.bateriaId = nuevoBat; bancState.seleccionBateriaAutomatica = true; }
      bancState.ajusteMsg = `Se reconfiguró el arreglo de paneles (antes ${panelAntes.marca} ${panelAntes.modelo}, ${nsAntes}s × ${npAntes}p; ahora ${describirArreglo(gen)}) y se seleccionó el regulador "${nombreEquipo('regulador',nuevoReg)}"${nuevoBat?` y la batería "${nombreEquipo('bateria',nuevoBat)}"`:''} para que cumplan.`;
    } else {
      const nuevoInv = autoSelectInversorId(gen);
      bancState.inversorId = nuevoInv; bancState.seleccionInversorAutomatica = true;
      bancState.ajusteMsg = `Se reconfiguró el arreglo de paneles (antes ${panelAntes.marca} ${panelAntes.modelo}, ${nsAntes}s × ${npAntes}p; ahora ${describirArreglo(gen)}) y se seleccionó el inversor "${nombreEquipo('inversor',nuevoInv)}" para que cumpla.`;
    }
    return;
  }

  // Paso 3: ni el equipo/batería ni el arreglo logran una combinación válida.
  bancState.ajusteMsg = null;
  bancState.configuracionImposible = mensajeConfiguracionImposible(esCon);
}
function validarEntradasBanco(){
  const warns = [];
  if(bancState.autonomiaDias<=0) warns.push('La autonomía (N) debe ser mayor que 0 días.');
  if(bancState.dodDisenoPct<=0 || bancState.dodDisenoPct>100) warns.push('El DoD de diseño debe estar entre 0% (exclusivo) y 100%.');
  if(bancState.etaInversor<=0 || bancState.etaInversor>1) warns.push('La eficiencia del inversor debe estar entre 0 y 1.');
  if(bancState.factorTemp<=0 || bancState.factorTemp>1) warns.push('El factor de temperatura debe estar entre 0 y 1.');
  if(bancState.tensionBancoV<=0) warns.push('La tensión nominal del sistema debe ser mayor que 0 V.');
  const bateria = (window.CATALOGO_BATERIAS||[]).find(b=>b.id===bancState.bateriaId);
  if(bateria && (bateria.etaIdaVueltaPct<=0 || bateria.etaIdaVueltaPct>100)) warns.push('La eficiencia de ida y vuelta de la batería debe estar entre 0% y 100%.');
  return warns;
}

/* --------------------------- RF-35: tasa C y recuperación tras agotar autonomía ---------------- */
function computeTasaC(gen, cfg){
  const inh = getInheritedData();
  // Corrientes a la tensión nominal del sistema, la misma con la que se verifica la corriente de
  // salida del regulador (TdR §6: 48 V nominales en ambas tecnologías).
  const iCargaA = cfg.vBanco>0 ? gen.cfg.potenciaInstaladaW / cfg.vBanco : null; // corriente máx. de carga hacia el banco
  const tasaCCarga = iCargaA!=null && cfg.ahInstalados>0 ? iCargaA/cfg.ahInstalados : null;
  const iDescargaA = cfg.vBanco>0 ? (inh.pmaxW / cfg.vBanco) / bancState.etaInversor : null; // corriente de descarga en la hora de demanda máxima
  const tasaCDescarga = iDescargaA!=null && cfg.ahInstalados>0 ? iDescargaA/cfg.ahInstalados : null;
  const cumpleCarga = tasaCCarga!=null ? tasaCCarga <= cfg.bateria.limiteCargaC : null;
  const cumpleDescarga = (cfg.bateria.limiteDescargaC!=null && tasaCDescarga!=null) ? (tasaCDescarga <= cfg.bateria.limiteDescargaC) : null;
  return { iCargaA, tasaCCarga, cumpleCarga, iDescargaA, tasaCDescarga, cumpleDescarga };
}
function computeTiempoRecuperacion(gen, cfg){
  if(!genState.recurso) return null;
  const hspAnual = genState.recurso.hspAnual;
  const eProdWhDia = gen.cfg.potenciaInstaladaW * hspAnual * genState.PR; // E_prod = Ppico x HSP_anual x PR
  const etaBat = cfg.bateria.etaIdaVueltaPct/100;
  const N = bancState.autonomiaDias;
  const eCCWhDia = cfg.eCCWhDia;
  const denom = eProdWhDia*etaBat - eCCWhDia;
  if(denom<=0) return { recupera:false, tRecDias:null, denom, eProdWhDia };
  const tRecDias = (N*eCCWhDia)/denom;
  return { recupera:true, tRecDias, denom, eProdWhDia };
}
function compararTecnologiasEnergiaPorAnio(gen){
  const catalogo = window.CATALOGO_BATERIAS||[];
  const filas = catalogo.map(b=>{
    const cfg = computeBancoBaterias(gen, b, opcionesBancoPara(b, false));
    // kWh nominales que hay que instalar (y reponer) por cada año de servicio: MENOR es mejor.
    const energiaPorAnioKWh = b.vidaAnios>0 ? cfg.kwhInstalados/b.vidaAnios : null;
    // Energía que el banco entrega a las cargas durante su vida (E_CC diaria × 365 × vida).
    const energiaVidaMWh = b.vidaAnios>0 ? cfg.eCCWhDia*365*b.vidaAnios/1e6 : null;
    return { bateria:b, cfg, energiaPorAnioKWh, energiaVidaMWh };
  });
  const validas = filas.filter(f=>f.energiaPorAnioKWh!=null);
  const mejor = validas.length ? Math.min(...validas.map(f=>f.energiaPorAnioKWh)) : null;
  filas.forEach(f=>{ f.esMejor = mejor!=null && f.energiaPorAnioKWh!=null && f.energiaPorAnioKWh<=mejor+1e-9; });
  return filas;
}

/* --------------------------- RF-34: balance de cierre ------------------------------------------ */
function computeBalanceCierre(gen, cfg){
  const etaBat = cfg.bateria.etaIdaVueltaPct/100;
  const eCCWhDia = cfg.eCCWhDia;
  const eGenWhDia = eCCWhDia/etaBat; // energía diaria a generar
  const hspAnual = genState.recurso ? genState.recurso.hspAnual : null;
  const hspCritico = genState.recurso ? Math.min(...genState.recurso.hspMensual) : null;
  const PR = genState.PR;
  const pReqAnualW = (hspAnual!=null && PR>0) ? ((eGenWhDia/1000)/(hspAnual*PR))*1000 : null;
  const pReqCriticoW = (hspCritico!=null && PR>0) ? ((eGenWhDia/1000)/(hspCritico*PR))*1000 : null;
  const instaladaW = gen.cfg.potenciaInstaladaW;
  const margenAnualPct = pReqAnualW ? (instaladaW-pReqAnualW)/pReqAnualW*100 : null;
  const margenCriticoPct = pReqCriticoW ? (instaladaW-pReqCriticoW)/pReqCriticoW*100 : null;
  const modulosAdicionalesAnual = pReqAnualW ? Math.max(0, Math.ceil(pReqAnualW/gen.panel.pMax) - gen.cfg.totalModulos) : null;
  const modulosAdicionalesCritico = pReqCriticoW ? Math.max(0, Math.ceil(pReqCriticoW/gen.panel.pMax) - gen.cfg.totalModulos) : null;
  return { eCCWhDia, eGenWhDia, hspAnual, hspCritico, PR, pReqAnualW, pReqCriticoW, instaladaW,
    margenAnualPct, margenCriticoPct, modulosAdicionalesAnual, modulosAdicionalesCritico };
}
// RF-34: resumen del ajuste aceptado, con la verificación de TODO el catálogo de reguladores
// contra el generador ampliado (tensión, corriente al banco e Isc, igual que la tabla ③).
function renderAjusteAceptado(gen, bal){
  const base = gen.base;
  const aj = bancState.ajusteBalance;
  const modsAnadidos = gen.cfg.totalModulos - base.cfg.totalModulos;
  const evs = (window.CATALOGO_REGULADORES||[]).map(e=>evaluarRegulador(gen, e));
  const cumplen = evs.filter(ev=>ev.veredicto==='cumple');
  const evSel = evs.find(ev=>ev.equipo.id===bancState.reguladorId);
  const iBanco = gen.cfg.potenciaInstaladaW / bancState.tensionBancoV;
  let veredictoEquipos;
  if(cumplen.length===0){
    veredictoEquipos = `<div style="color:var(--danger);margin-top:6px;">❌ Ningún regulador del catálogo admite el generador ampliado (corriente al banco ${fmt(iBanco,2)} A, Isc ${fmt(gen.cfg.corrienteArregloA,2)} A, Voc en frío ${fmt(gen.cfg.vocTotalStringV,2)} V). Agrega al catálogo un equipo de mayor capacidad, o reduce el generador (menos autonomía, otra tecnología de batería o deshacer el ajuste).</div>`;
  } else if(evSel && evSel.veredicto!=='cumple'){
    veredictoEquipos = `<div style="color:var(--warn);margin-top:6px;">⚠ El regulador elegido (${escapeHtml(nombreEquipo('regulador',bancState.reguladorId))}) ya no admite el generador ampliado: ${escapeHtml(evSel.fails.join(' '))} Sí lo admiten: ${cumplen.map(ev=>escapeHtml(nombreEquipo('regulador',ev.equipo.id))).join(', ')}.</div>`;
  } else {
    veredictoEquipos = `<div style="color:var(--success);margin-top:6px;">✓ El regulador elegido admite el generador ampliado (corriente al banco ${fmt(iBanco,2)} A). Equipos del catálogo que cumplen: ${cumplen.length}.</div>`;
  }
  return `
    <div><strong>Ajuste aceptado:</strong> el generador pasa de ${base.cfg.ns}s × ${base.cfg.np}p (${fmt(base.cfg.potenciaInstaladaW/1000,2)} kWp) a <strong>${gen.cfg.ns}s × ${gen.cfg.np}p (${fmt(gen.cfg.potenciaInstaladaW/1000,2)} kWp)</strong>: +${aj.npExtra} cadena(s) completa(s) de ${gen.cfg.ns} módulos = +${modsAnadidos} módulos (el balance pedía al menos ${aj.modsBalance}; se completa la cadena para no desbalancear el arreglo). Todo el componente se recalculó con este generador.</div>
    ${veredictoEquipos}`;
}

function renderRamaSelectorPanel(){
  const esCon = bancState.rama==='con-almacenamiento';
  const sinDeshabilitada = ramaSinAlmacenamientoDeshabilitada(state.appType);
  const conDeshabilitada = ramaConAlmacenamientoDeshabilitada(state.appType);
  const motivoSin = state.appType==='off-grid'
    ? 'un sistema off-grid siempre necesita banco de baterías y nunca está conectado a la red.'
    : 'un sistema híbrido off-grid tiene banco de baterías (que se puede cargar desde el generador o desde la red) pero no entrega energía a la red.';
  const motivoCon = 'un sistema on-grid no lleva banco de baterías: toda la energía se entrega directamente a la red.';
  return `
  <div class="panel">
    <div class="panel-header"><h3>② Rama del componente</h3><span class="hint">RF-25 — valor inicial según el tipo de aplicación del Reto 01; el usuario puede cambiarla</span></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <label class="rama-option ${esCon?'active':''}" style="flex:1;min-width:220px;display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:${conDeshabilitada?'not-allowed':'pointer'};${conDeshabilitada?'opacity:0.5;background:var(--bg-soft,#f2f2f2);':''}" title="${conDeshabilitada?('No disponible para '+APP_TYPE_LABELS[state.appType]+': '+motivoCon):''}">
        <input type="radio" name="rama" value="con-almacenamiento" ${esCon?'checked':''} ${conDeshabilitada?'disabled':''}>
        <span><strong>Con almacenamiento</strong><br><span class="small-note">Off-grid e híbridos — regulador MPPT + banco de baterías.${conDeshabilitada?' <strong>No disponible para On-grid.</strong>':''}</span></span>
      </label>
      <label class="rama-option ${!esCon?'active':''}" style="flex:1;min-width:220px;display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:${sinDeshabilitada?'not-allowed':'pointer'};${sinDeshabilitada?'opacity:0.5;background:var(--bg-soft,#f2f2f2);':''}" title="${sinDeshabilitada?('No disponible para '+APP_TYPE_LABELS[state.appType]+': '+motivoSin):''}">
        <input type="radio" name="rama" value="sin-almacenamiento" ${!esCon?'checked':''} ${sinDeshabilitada?'disabled':''}>
        <span><strong>Sin almacenamiento</strong><br><span class="small-note">On-grid sin baterías — inversor de conexión a red con entrada MPPT.${sinDeshabilitada?(' <strong>No disponible para '+APP_TYPE_LABELS[state.appType]+'.</strong>'):''}</span></span>
      </label>
    </div>
    ${sinDeshabilitada ? `<div class="small-note" style="margin-top:8px;color:var(--warn);">⚠ La rama "sin almacenamiento" está deshabilitada porque el tipo de aplicación declarado en el Reto 01 es <strong>${APP_TYPE_LABELS[state.appType]}</strong>: ${motivoSin} Para habilitarla, cambia el tipo de aplicación a On-grid o a un híbrido on-grid en la pestaña "Proyecto".</div>` : ''}
    ${casoPruebaActivo() && (sinDeshabilitada || conDeshabilitada) ? `<div class="small-note" style="margin-top:8px;color:var(--accent-2);">🧪 Caso de prueba estandarizado: para evaluar la rama ${sinDeshabilitada?'sin':'con'} almacenamiento, cambia el tipo de aplicación en "Proyecto" a ${sinDeshabilitada?'On-grid o Híbrido on-grid':'Off-grid o un híbrido'}. El generador (4 × 550 Wp), el PR y la tensión máxima del caso se conservan.</div>` : ''}
    ${conDeshabilitada ? `<div class="small-note" style="margin-top:8px;color:var(--warn);">⚠ La rama "con almacenamiento" está deshabilitada porque el tipo de aplicación declarado en el Reto 01 es <strong>On-grid</strong>: ${motivoCon} Para habilitarla, cambia el tipo de aplicación a Off-grid o a un híbrido en la pestaña "Proyecto".</div>` : ''}
    <div class="small-note" style="margin-top:8px;">${genState.criterioSeleccion==='conAlmacenamiento' || genState.criterioSeleccion==='sinAlmacenamiento'
      ? `Valor inicial fijado por el criterio de selección automática elegido en "Generador FV": <strong>${ramaSugerida(state.appType)==='con-almacenamiento'?'con almacenamiento':'sin almacenamiento'}</strong>.`
      : `Valor inicial sugerido según el tipo de aplicación (${APP_TYPE_LABELS[state.appType]}): <strong>${ramaSugerida(state.appType)==='con-almacenamiento'?'con almacenamiento':'sin almacenamiento'}</strong>.`
    }${bancState.ramaManual?' Has cambiado la rama manualmente.':''}</div>
  </div>`;
}

    </div>

      ? `<div class="small-note" style="margin-top:12px;color:var(--danger);">Corrige las entradas marcadas arriba para ver el dimensionamiento del banco, el balance de cierre y la comparación de tecnologías (RF-32).</div>`
      : (cfg ? renderBancoResultado(gen, cfg) : '')}
  </div>`;
}

function renderBalanceCierrePanel(gen){
  const bateria = (window.CATALOGO_BATERIAS||[]).find(b=>b.id===bancState.bateriaId);
  if(!bateria || validarEntradasBanco().length) return ''; // RF-32: sin resultados con entradas inválidas
  const cfg = computeBancoBaterias(gen, bateria);
  const bal = computeBalanceCierre(gen, cfg);
  if(bal.pReqAnualW==null){
    return `<div class="panel"><div class="panel-header"><h3>⑤ Balance de cierre</h3><span class="hint">RF-34</span></div>
      <div class="small-note">Consulta el recurso solar en "Generador FV" (HSP anual y del mes crítico) para calcular el balance de cierre.</div></div>`;
  }
  const deficitAnual = bal.margenAnualPct<0, deficitCritico = bal.margenCriticoPct<0;
  return `
  <div class="panel">
    <div class="panel-header"><h3>⑤ Balance de cierre</h3><span class="hint">RF-34 — potencia pico requerida recalculada con las eficiencias del inversor y de la batería</span></div>
    <div class="grid grid-4">
      <div class="result-card"><div class="rc-label">Energía a generar</div><div class="rc-value" style="font-size:15px;">${fmt(bal.eGenWhDia/1000,2)}<span class="unit">kWh/día</span></div><div class="rc-note">E<sub>CC</sub>/η<sub>bat</sub></div></div>
      <div class="result-card"><div class="rc-label">P. pico requerida (HSP anual)</div><div class="rc-value" style="font-size:15px;">${fmt(bal.pReqAnualW/1000,2)}<span class="unit">kWp</span></div></div>
      <div class="result-card"><div class="rc-label">P. pico requerida (mes crítico)</div><div class="rc-value" style="font-size:15px;">${fmt(bal.pReqCriticoW/1000,2)}<span class="unit">kWp</span></div></div>
      <div class="result-card"><div class="rc-label">Potencia instalada</div><div class="rc-value" style="font-size:15px;">${fmt(bal.instaladaW/1000,2)}<span class="unit">kWp</span></div></div>
    </div>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="result-card"><div class="rc-label">Margen / déficit vs. promedio anual</div><div class="rc-value" style="color:${deficitAnual?'var(--danger)':'var(--success)'}">${fmt(Math.abs(bal.margenAnualPct),2)}%<span class="unit">${deficitAnual?'déficit':'margen'}</span></div><div class="rc-note">${deficitAnual?('faltan ≈ '+bal.modulosAdicionalesAnual+' módulo(s) adicional(es)'):'cubre la demanda anual promedio'}</div></div>
      <div class="result-card"><div class="rc-label">Margen / déficit vs. mes crítico</div><div class="rc-value" style="color:${deficitCritico?'var(--danger)':'var(--success)'}">${fmt(Math.abs(bal.margenCriticoPct),2)}%<span class="unit">${deficitCritico?'déficit':'margen'}</span></div><div class="rc-note">${deficitCritico?('faltan ≈ '+bal.modulosAdicionalesCritico+' módulo(s) adicional(es)'):'cubre la demanda del mes crítico'}</div></div>
    </div>
    <div class="legend-row"><span>Margen o déficit [%] = (P<sub>instalada</sub> − P<sub>req</sub>) / P<sub>req</sub> × 100, con P<sub>req</sub> = E<sub>gen</sub> / (HSP × PR) como base. Módulos adicionales = ⌈P<sub>req</sub> / P<sub>módulo</sub>⌉ − módulos instalados.</span></div>
    ${gen.base ? `
    <div class="panel" style="margin-top:12px;border-color:var(--accent);">
      <div class="small-note">${renderAjusteAceptado(gen, bal)}
      ${(deficitAnual || deficitCritico) ? `<div style="color:var(--danger);margin-top:6px;">⚠ Aun con el ajuste persiste un déficit en ${deficitCritico?'el mes crítico':'el promedio anual'}.</div>` : ''}
      <button class="btn btn-ghost btn-sm" id="btnDeshacerAjusteBalance" style="margin-top:8px;">↺ Deshacer ajuste (volver al generador del Reto 02)</button></div>
    </div>`
    : (deficitAnual || deficitCritico) ? `
    <div class="panel" style="margin-top:12px;background:var(--danger-soft);border-color:var(--danger);">
      <div class="small-note">⚠ El generador instalado no alcanza a cubrir el balance de cierre en ${deficitCritico?'el mes crítico':'promedio anual'}. Al aceptar el ajuste se añaden ${npExtraParaBalance(gen,bal)} cadena(s) completa(s) de ${gen.cfg.ns} módulos (+${npExtraParaBalance(gen,bal)*gen.cfg.ns} módulos) y se recalcula todo el componente con el generador ampliado.
      <br><button class="btn btn-primary btn-sm" id="btnAceptarAjusteBalance" style="margin-top:8px;">Aceptar ajuste sugerido (añadir módulos)</button></div>
    </div>` : ''}
  </div>`;
}

function renderComparacionTecnologiasPanel(gen){
  if(validarEntradasBanco().length) return '';
  const comp = compararTecnologiasEnergiaPorAnio(gen);
  if(comp.length<2) return '';
  return `
  <div class="panel">
    <div class="panel-header"><h3>⑥ Comparación de tecnologías de batería</h3><span class="hint">RF-35 — energía nominal por año de servicio y energía entregada en la vida útil</span></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Tecnología</th><th>Equipo</th><th>DoD de diseño</th><th>Configuración</th><th>kWh instalados</th><th>Vida [años]</th><th>kWh / año de servicio</th><th>kWh entregados por kWh instalado</th></tr></thead>
        <tbody>
        ${comp.map(c=>`<tr class="${bancState.bateriaId===c.bateria.id?'selected-row':''}">
          <td><span class="tag tag-none">${c.bateria.tecnologia}</span></td>
          <td>${escapeHtml(c.bateria.marca)} ${escapeHtml(c.bateria.modelo)}</td>
          <td class="mono">${fmt(c.cfg.dod*100,0)}%</td>
          <td class="mono">${c.cfg.ns}s × ${c.cfg.np}p</td>
          <td class="mono">${fmt(c.cfg.kwhInstalados,2)}</td>
          <td class="mono">${fmt(c.bateria.vidaAnios,0)}</td>
          <td class="mono" style="${c.esMejor?'color:var(--success);font-weight:700;':''}">${c.energiaPorAnioKWh!=null?fmt(c.energiaPorAnioKWh,2):'—'}${c.esMejor?' ✓':''}</td>
          <td class="mono">${c.energiaVidaMWh!=null && c.cfg.kwhInstalados>0?fmt(c.energiaVidaMWh*1000/c.cfg.kwhInstalados,0):'—'}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="small-note" style="margin-top:8px;">"kWh / año de servicio" = kWh nominales instalados ÷ vida útil: es la capacidad que hay que comprar (y reponer) por cada año de operación, así que <strong>menor es mejor</strong> (✓). "kWh entregados por kWh instalado" = E<sub>CC</sub> × 365 × vida ÷ kWh instalados: cuánta energía entrega cada kWh comprado durante su vida, <strong>mayor es mejor</strong>; es la comparación justa de la sesión 10 (por kWh entregado, no por kWh instalado). Cada tecnología se dimensiona con su propio DoD de diseño. No incluye costos (fuera del alcance de este componente).</div>
  </div>`;
}

/* ============================ INFORME: sección Reto 03 ========================================= */
function buildBancoReportSection(){
  if(!getGeneradorSeleccionado()) return `<div class="rp-section-title">Regulador/Inversor y banco de baterías — Reto 03</div>
    <div style="font-size:10px;color:#777;">Aún no se ha completado el dimensionamiento del generador en "Generador FV", por lo que esta sección no pudo calcularse.</div>`;
  if(!bancState.ramaManual) bancState.rama = ramaSugerida(state.appType);
  aplicarRestriccionRamaPorAppType();
  const esCon = bancState.rama==='con-almacenamiento';
  const gen = getGeneradorReto3();
  const inh = getInheritedData();
  const verifBadge = (inh.esVerificacion && genState.panelSeleccionadoId==='ref-caso-prueba') ? ' <span style="font-size:8px;background:#38BDF822;color:#1a6fa3;padding:1px 6px;border-radius:999px;">modo verificación: caso de prueba estandarizado</span>' : '';

  let html = `<div class="rp-section-title">Regulador/Inversor y banco de baterías — Reto 03${verifBadge}</div>
    <div style="font-size:9.5px;color:#777;margin-bottom:6px;">Rama activa: <strong>${esCon?'con almacenamiento':'sin almacenamiento'}</strong> (según tipo de aplicación: ${APP_TYPE_LABELS[state.appType]}).</div>
    ${gen.base ? `<div style="font-size:9.5px;color:#1a6fa3;margin-bottom:6px;">Ajuste del balance de cierre aceptado: generador ampliado de ${gen.base.cfg.ns}s × ${gen.base.cfg.np}p (${fmt(gen.base.cfg.potenciaInstaladaW/1000,2)} kWp) a ${gen.cfg.ns}s × ${gen.cfg.np}p (${fmt(gen.cfg.potenciaInstaladaW/1000,2)} kWp); los resultados de esta sección usan el generador ampliado.</div>` : ''}`;

  if(esCon){
    if(bancState.seleccionBateriaAutomatica && bancState.bateriaId===null) bancState.bateriaId = autoSelectBateriaId(gen);
    const bateriaSync = (window.CATALOGO_BATERIAS||[]).find(b=>b.id===bancState.bateriaId);
    if(bateriaSync && !bancState.tensionBancoManual) bancState.tensionBancoV = defaultBankVoltageForBattery(bateriaSync);
    if(bateriaSync && !bancState.dodManual) bancState.dodDisenoPct = bateriaSync.dodDisenoPct;
    if(bancState.seleccionReguladorAutomatica && bancState.reguladorId===null) bancState.reguladorId = autoSelectReguladorId(gen);
    const eq = (window.CATALOGO_REGULADORES||[]).find(e=>e.id===bancState.reguladorId);
    const bateria = bateriaSync;
    if(eq){
      const ev = evaluarRegulador(gen, eq);
      html += `<table style="margin-bottom:8px;"><tbody>
        <tr><td>Regulador seleccionado</td><td colspan="3">${escapeHtml(eq.marca)} ${escapeHtml(eq.modelo)} — ${veredictoBadge(ev.veredicto)}</td></tr>
        <tr><td>Módulos máx. en serie admitidos</td><td>${ev.vArr.nsMaxEquipo}</td><td>Ns usado</td><td>${ev.vArr.nsUsado}</td></tr>
        <tr><td>Voc en frío del arreglo</td><td>${fmt(ev.vArr.vocFrioV,2)} V (máx. equipo ${fmt(eq.vocMaxV,2)} V)</td><td>Corriente de salida al banco</td><td>${fmt(ev.vCor.iSalidaBancoA,2)} A</td></tr>
        <tr><td>Isc del generador</td><td>${fmt(ev.vCor.iscGeneradorA,2)} A (máx. equipo ${fmt(eq.iscMaxA,2)} A)</td><td>Corriente de diseño conductores (1,25 × Isc)</td><td>${fmt(ev.vCor.iDisenoConductoresA,2)} A</td></tr>
      </tbody></table>`;
      if(ev.fails.length) html += `<div style="font-size:9px;color:#b33;">⚠ ${ev.fails.join(' ')}</div>`;
    } else {
      html += `<div style="font-size:9px;color:#b33;">⚠ Ningún regulador del catálogo admite el arreglo del Reto 02 (RF-31/RF-34). Se sugiere agregar un equipo de mayor capacidad de tensión/corriente al catálogo, o reconfigurar las cadenas del Reto 02.</div>`;
    }
    const erroresBanco = validarEntradasBanco();
    if(bateria && erroresBanco.length){
      html += `<div style="font-size:9px;color:#b33;margin-top:6px;">⚠ El banco de baterías no se calculó porque hay entradas fuera de rango: ${erroresBanco.map(escapeHtml).join(' ')}</div>`;
    } else if(bateria){
      const cfg = computeBancoBaterias(gen, bateria);
      const bal = computeBalanceCierre(gen, cfg);
      const tasaC = computeTasaC(gen, cfg);
      const rec = computeTiempoRecuperacion(gen, cfg);
      html += `<table style="margin-top:6px;"><tbody>
        <tr><td>Batería</td><td colspan="3">${escapeHtml(bateria.marca)} ${escapeHtml(bateria.modelo)} (${bateria.tecnologia})</td></tr>
        <tr><td>Autonomía</td><td>${fmt(bancState.autonomiaDias,0)} días</td><td>DoD de diseño</td><td>${fmt(bancState.dodDisenoPct,1)}%</td></tr>
        <tr><td>Capacidad nominal</td><td>${fmt(cfg.cnAh,1)} Ah (${fmt(cfg.cnWh/1000,2)} kWh)</td><td>Configuración</td><td>${cfg.ns}s × ${cfg.np}p (${cfg.numBaterias} unidades)</td></tr>
        <tr><td>Ah / kWh instalados</td><td>${fmt(cfg.ahInstalados,0)} Ah / ${fmt(cfg.kwhInstalados,2)} kWh</td><td>DoD al final de la autonomía</td><td>${cfg.dodFinal!=null?fmt(cfg.dodFinal*100,1)+'%':'—'}</td></tr>
        <tr><td>Tasa C de carga</td><td>${tasaC.tasaCCarga!=null?fmt(tasaC.tasaCCarga,3):'—'} C (límite ${fmt(bateria.limiteCargaC,2)} C)</td><td>Tasa C de descarga</td><td>${tasaC.tasaCDescarga!=null?fmt(tasaC.tasaCDescarga,3):'—'} C${bateria.limiteDescargaC!=null?(' (límite '+fmt(bateria.limiteDescargaC,2)+' C)'):' (límite no declarado)'}</td></tr>
        <tr><td>Recuperación tras agotar autonomía</td><td colspan="3">${rec==null?'—':(rec.recupera?fmt(rec.tRecDias,2)+' días':'⚠ el banco no se recupera con este generador')}</td></tr>
      </tbody></table>`;
      if(bal.pReqAnualW!=null){
        const deficitAnual = bal.margenAnualPct<0, deficitCritico = bal.margenCriticoPct<0;
        html += `<table style="margin-top:6px;"><tbody>
          <tr><td>Balance de cierre — P. pico requerida (anual / mes crítico)</td><td colspan="3">${fmt(bal.pReqAnualW/1000,2)} / ${fmt(bal.pReqCriticoW/1000,2)} kWp (instalada: ${fmt(bal.instaladaW/1000,2)} kWp)</td></tr>
          <tr><td>Margen / déficit anual (base: P<sub>req</sub>)</td><td>${fmt(Math.abs(bal.margenAnualPct),2)}% ${deficitAnual?'déficit':'margen'}</td><td>Margen / déficit mes crítico</td><td>${fmt(Math.abs(bal.margenCriticoPct),2)}% ${deficitCritico?'déficit':'margen'}</td></tr>
        </tbody></table>`;
        if(deficitAnual || deficitCritico) html += `<div style="font-size:9px;color:#b33;">⚠ Déficit de generación frente al balance de cierre; se sugieren ${Math.max(bal.modulosAdicionalesAnual||0,bal.modulosAdicionalesCritico||0)} módulo(s) adicional(es).</div>`;
      }
    }
  } else {
    if(bancState.seleccionInversorAutomatica && bancState.inversorId===null) bancState.inversorId = autoSelectInversorId(gen);
    const eq = (window.CATALOGO_INVERSORES||[]).find(e=>e.id===bancState.inversorId);
    if(eq){
      const ev = evaluarInversor(gen, eq);
      html += `<table style="margin-bottom:8px;"><tbody>
        <tr><td>Inversor seleccionado</td><td colspan="3">${escapeHtml(eq.marca)} ${escapeHtml(eq.modelo)} — ${veredictoBadge(ev.veredicto)}</td></tr>
        <tr><td>Relación DC/AC</td><td>${fmt(ev.dcac.ratio,2)} (rango ${fmt(bancState.dcAcMin,2)}–${fmt(bancState.dcAcMax,2)})</td><td>Potencia CA nominal</td><td>${fmt(eq.pacW,2)} W</td></tr>
        <tr><td>Voc en frío del arreglo</td><td>${fmt(ev.vArr.vocFrioV,2)} V (máx. equipo ${fmt(eq.vocMaxV,2)} V)</td><td>Ventana MPPT</td><td>${fmt(eq.ventanaMpptMinV,0)}–${fmt(eq.ventanaMpptMaxV,0)} V</td></tr>
        <tr><td>Imp del generador</td><td>${fmt(ev.vCor.impGeneradorA,2)} A (máx. equipo ${fmt(eq.impMaxA,2)} A)</td><td>Isc del generador</td><td>${fmt(ev.vCor.iscGeneradorA,2)} A (máx. equipo ${fmt(eq.iscMaxA,2)} A)</td></tr>
      </tbody></table>`;
      if(ev.fails.length) html += `<div style="font-size:9px;color:#b33;">⚠ ${ev.fails.join(' ')}</div>`;
      if(ev.dcac.alerta) html += `<div style="font-size:9px;color:#b36b00;">⚠ ${escapeHtml(ev.dcac.alerta)}</div>`;
    } else {
      html += `<div style="font-size:9px;color:#b33;">⚠ Ningún inversor del catálogo admite el arreglo del Reto 02 (RF-31/RF-34). Se sugiere agregar un equipo de mayor capacidad de tensión/corriente al catálogo, o reconfigurar las cadenas del Reto 02.</div>`;
    }
  }
  html += `<div style="font-size:9px;color:#888;margin-top:8px;">
    <strong>Método:</strong> Voc en frío = Voc·[1+|β|·(25−T<sub>mín</sub>)]; Vmp en caliente = Vmp·[1−|β|·(T<sub>c</sub>−25)]; Vmp en frío = Vmp·[1+|β|·(25−T<sub>mín</sub>)]; corriente de salida al banco = P<sub>pico</sub>/V<sub>nominal</sub> (sin el factor 1,25, reservado a conductores/protecciones, NTC 2050 art. 690-8); relación DC/AC = P<sub>pico</sub>/P<sub>ac</sub>. Banco: E<sub>CC</sub>=E<sub>d</sub>/η<sub>inv</sub>; C<sub>n</sub>=(E<sub>CC</sub>·N)/(DoD·f<sub>T</sub>); E<sub>gen</sub>=E<sub>CC</sub>/η<sub>bat</sub>; P<sub>req</sub>=E<sub>gen</sub>/(HSP·PR); t<sub>rec</sub>=(N·E<sub>CC</sub>)/(E<sub>prod</sub>·η<sub>bat</sub>−E<sub>CC</sub>).
  </div>`;
  return html;
}

function buildReportHtml(){
  const loads = state.loads;
  const pinst = installedPower(loads);
  const profile = hourlyProfile(loads);
  const pmax = maxDemand(profile);
  const ed = dailyEnergy(profile);
  const em = monthlyEnergy(ed, state.opDaysPerMonth);
  const ea = annualEnergy(ed, state.opDaysPerYear);
  const c = costs(ed, em, ea, state.unitCost);
  const appTypeName = (APP_TYPES.find(t=>t.id===state.appType)||{}).name || state.appType;
  const maxP = Math.max(...profile,1);
  const byPeriod = energyByPeriod(profile, state.dayStart, state.dayEnd);

  return `<div class="report-page" id="reportPageInner">
    <div class="rp-header">
      <div>
        <div class="rp-title">${escapeHtml(state.name)||'Proyecto sin nombre'}</div>
        <div class="rp-sub">ID: ${escapeHtml(state.id)||'—'} · Integrantes: ${escapeHtml(state.members)||'—'} · Fecha: ${escapeHtml(state.date)}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:11px;font-weight:700;">Reto 01 — Requerimiento Energético ESFV</div>
        <div class="rp-sub">Tipo de aplicación: ${appTypeName}</div>
      </div>
    </div>

    <div class="rp-section-title">Indicadores principales</div>
    <div class="rp-kpi-grid">
      <div class="rp-kpi"><div class="l">Potencia instalada</div><div class="v">${fmt(pinst/1000,2)} kW</div></div>
      <div class="rp-kpi"><div class="l">Demanda máxima</div><div class="v">${fmt(pmax.value/1000,2)} kW</div></div>
      <div class="rp-kpi"><div class="l">Energía diaria</div><div class="v">${fmt(ed,2)} kWh</div></div>
      <div class="rp-kpi"><div class="l">Energía anual</div><div class="v">${fmt(ea,2)} kWh</div></div>
    </div>
    <div class="rp-kpi-grid">
      <div class="rp-kpi"><div class="l">Energía mensual</div><div class="v">${fmt(em,2)} kWh</div></div>
      <div class="rp-kpi"><div class="l">Costo diario</div><div class="v">${money(c.daily)}</div></div>
      <div class="rp-kpi"><div class="l">Costo mensual</div><div class="v">${money(c.monthly)}</div></div>
      <div class="rp-kpi"><div class="l">Costo anual</div><div class="v">${money(c.annual)}</div></div>
    </div>
    <div class="rp-kpi-grid">
      <div class="rp-kpi"><div class="l">☀ Energía diurna</div><div class="v">${fmt(byPeriod.diurnal,2)} kWh</div></div>
      <div class="rp-kpi"><div class="l">☾ Energía nocturna</div><div class="v">${fmt(byPeriod.nocturnal,2)} kWh</div></div>
      <div class="rp-kpi"><div class="l">Ventana diurna</div><div class="v" style="font-size:12px;">${hh(state.dayStart)}–${hh(state.dayEnd)}</div></div>
      <div class="rp-kpi"><div class="l">Costo unitario</div><div class="v" style="font-size:13px;">$${fmt(state.unitCost,2)}/kWh</div></div>
    </div>

    <div class="rp-section-title">Perfil horario de demanda P(h)</div>
    <svg viewBox="0 0 760 130" width="100%" height="110" style="display:block;">
      ${profile.map((p,h)=>{
        const bw = 760/24; const bh = (p/maxP)*78; const isMax = h===pmax.hour;

/* RF-24: sección del informe correspondiente al Reto 02 (generador fotovoltaico) */
function buildGeneradorReportSection(){
  if(state.loads.length===0 && !genState.overrideCasoPrueba) return '';
  const inh = getInheritedData();
  const split = solarWindowSplit(inh.profile);
  const hsp = hspSeleccionado();
  const ppicoW = computePpicoW();
  const r = genState.recurso;

  const verifBadge = inh.esVerificacion ? ' <span style="font-size:8px;background:#38BDF822;color:#1a6fa3;padding:1px 6px;border-radius:999px;">modo verificación: caso de prueba estandarizado</span>' : '';

  if(!r || ppicoW==null){
    return `
    <div class="rp-section-title">Generador fotovoltaico — Reto 02${verifBadge}</div>
    <div style="font-size:10px;color:#777;">Aún no se ha consultado el recurso solar en la pestaña "Generador FV", por lo que esta sección no pudo calcularse. Completa ese módulo y vuelve a generar el informe para incluir el dimensionamiento del generador.</div>`;
  }

  const panel = (window.CATALOGO_PANELES||[]).find(p=>p.id===genState.panelSeleccionadoId);
  const esApiSrc = r.fuente==='api';
  const fuenteTxt = esApiSrc
    ? `API PVWatts (NREL/NSRDB), consulta en línea`
    : `Base de datos local de respaldo (window.BASE_DATOS_SOLAR) — ${r.fuenteTexto||''}`;
  const fechaConsulta = r.consultadoEn ? new Date(r.consultadoEn).toLocaleString('es-CO') : '—';
  // RF-24: nombre del sitio y coordenadas explícitas, siempre visibles sin importar el origen (API o local)
  const sitioHtml = `
    <table style="margin:6px 0 8px;">
      <tbody>
        <tr><td>Origen de los datos</td><td>${esApiSrc?'API en línea':'Base de datos local (contingencia RF-15)'}</td><td>Sitio consultado</td><td>${escapeHtml(r.casoNombre||'—')}</td></tr>

      <tbody><tr>${r.hspMensual.map(v=>{
        const isMin = v===Math.min(...r.hspMensual);

      }).join('')}<td style="font-weight:700;">${fmt(r.hspAnual,2)}</td></tr></tbody>
    </table>`;

  let panelBlock = '<div style="font-size:10px;color:#777;">Aún no se ha elegido una referencia comercial en el catálogo; se muestra solo el requerimiento de potencia pico.</div>';
  if(panel){
    const cfg = computePanelConfig(panel, ppicoW, genState.panelNsExtra||0);
    const excedenteW = cfg.potenciaInstaladaW - ppicoW;
    const excedentePct = ppicoW>0 ? (excedenteW/ppicoW*100) : 0;
    panelBlock = `
    <table style="margin-top:8px;">
      <tbody>
        <tr><td>Referencia seleccionada</td><td colspan="3">${escapeHtml(panel.marca)} ${escapeHtml(panel.modelo)} (${fmt(panel.pMax,2)} W, Voc ${fmt(panel.voc,2)} V, Isc ${fmt(panel.isc,2)} A)${panel.esReferenciaNoComercial?' — módulo de referencia no comercial':''}</td></tr>
        <tr><td>Criterio de selección aplicado</td><td colspan="3">${CRITERIO_SELECCION_LABELS[genState.criterioSeleccion]}${genState.seleccionAutomatica?' (automático)':' (elegido manualmente por el usuario)'}</td></tr>
        <tr><td>Configuración en cadenas</td><td>${cfg.ns} en serie × ${cfg.np} en paralelo (${cfg.ns}s${cfg.np}p)</td><td>Módulos totales</td><td>${cfg.totalModulos}</td></tr>
        <tr><td>Potencia instalada</td><td>${fmt(cfg.potenciaInstaladaW/1000,2)} kW</td><td>${excedenteW>=0?'Excedente':'Déficit'}</td><td>${fmt(Math.abs(excedenteW)/1000,2)} kW (${fmt(Math.abs(excedentePct),2)}%)</td></tr>
        <tr><td>Voc del generador en frío</td><td>${fmt(cfg.vocTotalStringV,2)} V (máx. ${fmt(genState.vMaxSistema,2)} V)</td><td>Vmp del generador en operación</td><td>${fmt(cfg.vmpOperacion*cfg.ns,2)} V</td></tr>
        <tr><td>Isc del generador</td><td>${fmt(cfg.corrienteArregloA,2)} A</td><td>Corriente de diseño (690-8)</td><td>${fmt(cfg.corrienteDisenoA,2)} A</td></tr>

        ${cfg.nsExtra!==0 ? `<tr><td>Ajuste automático de cadenas</td><td colspan="3">Reconfigurada a ${cfg.ns} módulos en serie (${cfg.nsBase}s → ${cfg.ns}s, mismo total aproximado de módulos) para que exista un equipo comercial que cumple en el catálogo del Reto 03.</td></tr>` : ''}

    </div>
    ${sitioHtml}
    <div style="font-size:9px;color:#777;margin-bottom:2px;">Valores mensuales de GTI/HSP [kWh/m²·día] extraídos y aplicados de la fuente declarada (negrita = mes de menor recurso):</div>
    ${tablaMensualHtml}
    ${panelBlock}
    <div style="font-size:9px;color:#888;margin-top:8px;">
      <strong>Fuente del recurso solar:</strong> ${escapeHtml(fuenteTxt)} · <strong>Fecha de consulta:</strong> ${escapeHtml(fechaConsulta)} · <strong>Criterio de irradiación:</strong> ${hsp.etiqueta} · <strong>PR declarado:</strong> ${fmt(genState.PR,2)} (${escapeHtml(prJustificationText(inh.appType))})<br>
      <strong>Supuestos:</strong> Voc,gen = Nserie × Voc,STC × [1 + β×(Tmin−25)] (NTC 2050 art. 690-7) a T<sub>amb,mín</sub>=${fmt(genState.tAmbMin,2)}°C; T<sub>celda</sub> = T<sub>amb,op</sub> + (NOCT−20)×(G/800) con G=1000 W/m² y T<sub>amb,op</sub>=${fmt(genState.tAmbOperacion,2)}°C; Vmp de operación estimado aplicando el mismo coeficiente β (no se publica un coeficiente de Vmp independiente en la mayoría de fichas técnicas); I<sub>diseño</sub> = 1,25×1,25×Isc,gen (NTC 2050 art. 690-8); ventana solar de referencia ${hh(genState.ventanaInicio)}–${hh(genState.ventanaFin)}.

const CHART_COLORS = { text:'#8FA0B3', grid:'#1F2833' };
let chartDefaultsApplied = false;
function ensureChartDefaults(){
  if(chartDefaultsApplied || typeof Chart === 'undefined') return;
  Chart.defaults.color = CHART_COLORS.text;
  Chart.defaults.font.family = "'JetBrains Mono', monospace";
  Chart.defaults.borderColor = CHART_COLORS.grid;
  chartDefaultsApplied = true;
}

function destroyChart(){ if(charts.main){ charts.main.destroy(); charts.main=null; } }

        borderColor:'#F87171', backgroundColor:'#F8717122',
        borderWidth:2.5, tension:0.4, cubicInterpolationMode:'monotone',
        pointRadius:0, pointHoverRadius:4, fill:false, order:1,
      }]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:true, position:'top', labels:{boxWidth:10,font:{size:10}}},
          tooltip:{ callbacks:{ label:(c)=> `${c.dataset.label}: ${fmt(c.parsed.y,2)} kW` } },
          title:{display:true, text:`Perfil horario de potencia — Pmax = ${fmt(pmax.value/1000,2)} kW a las ${hh(pmax.hour)}`, color:'#E9EEF4', font:{size:12,weight:'600'}}
        },
        scales:{ y:{ title:{display:true,text:'Potencia [kW]'}, grid:{color:CHART_COLORS.grid} }, x:{ grid:{display:false} } },
        onClick:(evt, els)=>{ if(els.length){ selectedHour = els[0].index; render(); } }
      }

    const cumulative = []; profile.reduce((acc,p,i)=>{ const c=acc+p/1000; cumulative[i]=c; return c; },0);
    charts.main = new Chart(ctx,{
      type:'bar',
      data:{ labels, datasets:[
        { type:'bar', label:'Energía por hora [kWh]', data: profile.map(p=>p/1000), backgroundColor:'#F5A623AA', borderRadius:3, maxBarThickness:26, order:2 },
        { type:'line', label:'Energía acumulada [kWh]', data: cumulative, borderColor:'#38BDF8', backgroundColor:'#38BDF8', tension:.3, yAxisID:'y1', pointRadius:2, order:1 }
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{position:'top',labels:{boxWidth:10,font:{size:10}}},
          title:{display:true, text:`Energía diaria total = ${fmt(dailyEnergy(profile),2)} kWh/día`, color:'#E9EEF4', font:{size:12,weight:'600'}} },
        scales:{
          y:{ title:{display:true,text:'kWh'}, grid:{color:CHART_COLORS.grid} },
          y1:{ position:'right', grid:{display:false}, title:{display:true,text:'Acumulado [kWh]'} },
          x:{ grid:{display:false} }

  } else if(activeChart==='fu'){
    const selected = loads.filter(l=>fuSelectedLoads.has(l.id));

      type:'line',
      data:{ labels, datasets: selected.map(l=>({

        borderColor:l.color, backgroundColor:l.color+'33', tension:.2, pointRadius:2, borderWidth:2
      })) },
      options:{

        type:'doughnut',
