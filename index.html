<style>
:root{
  --bg:#0E1217;
  --bg-2:#0B0E13;
  --panel:#161C24;
  --panel-2:#1D2530;
  --panel-3:#242E3B;
  --border:#2A3441;
  --border-soft:#1F2833;
  --text:#E9EEF4;
  --text-dim:#8FA0B3;
  --text-faint:#5C6C7E;
  --accent:#F5A623;
  --accent-soft:#F5A62322;
  --accent-2:#38BDF8;
  --accent-2-soft:#38BDF822;
  --night:#7C6FF0;
  --success:#34D399;
  --danger:#F87171;
  --danger-soft:#F8717122;
  --warn:#FBBF24;
  --radius:10px;
  --radius-sm:6px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% -10%, #1a2230 0%, transparent 45%),
    radial-gradient(circle at 100% 0%, #1c1a14 0%, transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.45;
  min-height:100vh;
}
::selection{background:var(--accent);color:#1a1206;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:.01em;}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--panel-3);}

.mono{font-family:var(--font-mono);}
.hidden{display:none !important;}

/* ===== Header ===== */
.app-header{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:18px;
  padding:10px 20px;
  background:rgba(11,14,19,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:conic-gradient(from 220deg, var(--night), var(--accent-2) 35%, var(--accent) 65%, var(--night));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:13px;color:#0B0E13;
  box-shadow:0 0 0 1px var(--border-soft), 0 4px 14px -4px #0008;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text .title{font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--text);}
.brand-text .subtitle{font-size:10.5px;color:var(--text-faint);letter-spacing:.03em;text-transform:uppercase;}

.project-id-chip{
  display:flex;align-items:center;gap:9px;
  padding:6px 12px;border:1px solid var(--border);border-radius:999px;
  background:var(--panel);flex-shrink:0;min-width:0;
}
.project-id-chip .name{font-weight:600;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.project-id-chip .id{color:var(--text-faint);font-family:var(--font-mono);font-size:11px;}

.status-badge{
  display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:600;
  flex-shrink:0;white-space:nowrap;
}
.status-badge .dot{width:6px;height:6px;border-radius:50%;}
.status-saved{background:#34D39918;color:#5EEAB8;}
.status-saved .dot{background:#34D399;}
.status-dirty{background:#FBBF2418;color:#FDD873;}
.status-dirty .dot{background:#FBBF24;}
.status-new{background:#38BDF818;color:#8FD9FA;}
.status-new .dot{background:#38BDF8;}

.header-spacer{flex:1;}
.header-actions{display:flex;gap:8px;flex-shrink:0;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);
  font-size:12.5px;font-weight:600;transition:all .15s ease;white-space:nowrap;
}
.btn:hover{background:var(--panel-3);border-color:#3A4657;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#1A1206;}
.btn-primary:hover{background:#FFB53A;border-color:#FFB53A;}
.btn-ghost{background:transparent;}
.btn-danger{color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);border-color:#B4403F;}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn-icon{padding:8px;width:34px;height:34px;justify-content:center;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ===== KPI strip ===== */
.kpi-strip{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--border-soft);border-bottom:1px solid var(--border-soft);
}
.kpi-card{
  background:var(--bg-2);padding:12px 16px;display:flex;flex-direction:column;gap:3px;
  transition:background .15s;
}
.kpi-card:hover{background:#10141b;}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:600;}
.kpi-value{font-family:var(--font-mono);font-size:19px;font-weight:600;color:var(--text);}
.kpi-value .unit{font-size:11px;color:var(--text-dim);font-weight:500;margin-left:3px;}
.kpi-sub{font-size:10.5px;color:var(--accent);font-family:var(--font-mono);}

/* ===== Tabs ===== */
.tabs-nav{
  display:flex;gap:2px;padding:0 20px;background:var(--bg-2);
  border-bottom:1px solid var(--border-soft);overflow-x:auto;
}
.tab-btn{
  display:flex;align-items:center;gap:8px;padding:12px 16px;
  background:transparent;border:none;border-bottom:2px solid transparent;
  color:var(--text-faint);font-size:12.5px;font-weight:600;letter-spacing:.01em;
  white-space:nowrap;transition:all .15s;
}
.tab-btn .num{
  width:18px;height:18px;border-radius:5px;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);
}
.tab-btn:hover{color:var(--text-dim);}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent);}
.tab-btn.active .num{background:var(--accent);color:#1A1206;}

/* ===== Layout ===== */
main{padding:22px 20px 60px;max-width:1600px;margin:0 auto;}
.tab-panel{display:none;animation:fadein .2s ease;}
.tab-panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.section-title{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
.section-title h2{font-size:16.5px;font-weight:600;}
.section-title .desc{font-size:12px;color:var(--text-faint);}

.panel{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:18px;
}
.panel + .panel{margin-top:16px;}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.panel-header h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;}
.panel-header .hint{font-size:11.5px;color:var(--text-faint);}

.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:680px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.field{display:flex;flex-direction:column;gap:6px;}

<body>
<div id="app"></div>
<div class="toast-stack" id="toastStack"></div>
<input type="file" id="fileLoadInput" accept="application/json" class="hidden">
<script>




/* =========================================================================
   ESFV — Requerimiento Energético · Reto 01
   Motor de cálculo + interfaz. Arquitectura: Datos / Cálculos / Interfaz /
   Persistencia / Informe. Todo en un único script para un único archivo HTML.
   ========================================================================= */

/* ---------------------------- CONSTANTES ------------------------------- */
const HOURS = Array.from({length:24},(_,i)=>i);                 // 00..23
const DEFAULT_DAY_START = 6;                                    // 06:00 inicio diurno (editable)
const DEFAULT_DAY_END   = 18;                                   // 18:00 inicio nocturno (editable)
const DEFAULT_UNIT_COST = 0.65;                                 // $/kWh — visible y editable, NO oculto
const DEFAULT_OP_DAYS   = { perMonth: 30, perYear: 365 };       // días de operación — visibles y editables
const LOAD_COLORS = ['#F5A623','#38BDF8','#7C6FF0','#34D399','#F87171','#FBBF24','#22D3EE','#FB7185','#A3E635','#C084FC','#4ADE80','#FCA5A5'];
const CHART_TYPES = ['power','energy','fu','distribution'];

/* ------------------------------ ESTADO ---------------------------------- */
let state = null;
let dirty = false;
let savedOnce = false;
let activeTab = 'proyecto';
let activeChart = 'power';
let selectedLoadId = null;
let selectedHour = null;
let editingLoadId = null;   // load being edited in modal, null = new
let modalDraft = null;      // working copy of load in modal
let fuSelectedLoads = new Set(); // for fu chart multi-select
let heatmapExpanded = true;
let charts = {}; // chart.js instances

function uid(prefix){ return prefix + Math.random().toString(36).slice(2,7); }

function newProject(){
  return {
    name:'', id:'', members:'', date: new Date().toISOString().slice(0,10),
    appType:'off-grid',
    dayStart: DEFAULT_DAY_START, dayEnd: DEFAULT_DAY_END,
    opDaysPerMonth: DEFAULT_OP_DAYS.perMonth, opDaysPerYear: DEFAULT_OP_DAYS.perYear,
    unitCost: DEFAULT_UNIT_COST,
    loads: []
  };
}
function newLoad(idx){
  return {
    id: uid('C'), code: 'C'+(idx),
    description:'', quantity:1, unitPower:0,
    schedule: [], // {start,end} hour ints, end>start normal, end<=start = cruza medianoche
    fu: Array(24).fill(1),
    color: LOAD_COLORS[(idx-1)%LOAD_COLORS.length]
  };
}

/* ============================ CÁLCULOS (puro) =========================== */

// Determina si la hora h (0-23) está dentro de algún intervalo de la carga
function hourInSchedule(load,h){
  for(const iv of load.schedule){
    if(iv.end>iv.start){ if(h>=iv.start && h<iv.end) return true; }
    else { if(h>=iv.start || h<iv.end) return true; } // cruza medianoche
  }
  return false;
}
// Conjunto de horas activas de una carga
function activeHours(load){ return HOURS.filter(h=>hourInSchedule(load,h)); }

// Factor de utilización EFECTIVO en la hora h: fuerza 0 fuera de horario (regla sección 10)
function effectiveFu(load,h){
  if(!hourInSchedule(load,h)) return 0;
  const v = load.fu[h];
  return Math.min(1, Math.max(0, (typeof v==='number' && !isNaN(v)) ? v : 0));
}
// Potencia demandada por una carga en la hora h [W]: Ni x Pi x Fu,i(h)
function loadPowerAtHour(load,h){ return load.quantity * load.unitPower * effectiveFu(load,h); }

// Potencia instalada Pinst = Σ(Ni x Pi) [W]
function installedPower(loads){ return loads.reduce((s,l)=> s + l.quantity*l.unitPower, 0); }

// Perfil horario de demanda P(h) = Σ[Ni x Pi x Fu,i(h)] para las 24 horas [W]
function hourlyProfile(loads){
  return HOURS.map(h => loads.reduce((s,l)=> s + loadPowerAtHour(l,h), 0));
}
// Demanda máxima Pmax = max[P(h)]
function maxDemand(profile){
  let idx=0; for(let h=1;h<24;h++) if(profile[h]>profile[idx]) idx=h;
  return { value: profile[idx]||0, hour: idx };
}
// Curva suavizada (envolvente tipo campana) del perfil horario mediante suavizado gaussiano circular.
// Útil para visualizar la tendencia general de la demanda y las horas de mayor carga sin el "escalonado" crudo.
function gaussianSmoothProfile(profile, sigma=1.4){
  const n = 24;
  const out = new Array(n).fill(0);
  for(let i=0;i<n;i++){
    let wsum=0, vsum=0;
    for(let j=0;j<n;j++){
      let d = Math.abs(i-j);
      d = Math.min(d, n-d); // distancia circular (envuelve medianoche)
      const w = Math.exp(-(d*d)/(2*sigma*sigma));
      wsum += w; vsum += w*profile[j];
    }
    out[i] = vsum/wsum;
  }
  return out;
}
// Energía diaria Ed = Σ P(h) x Δt / 1000, Δt = 1h -> kWh/día
function dailyEnergy(profile){ return profile.reduce((a,b)=>a+b,0) / 1000; }

// Desglose de energía diaria entre periodo diurno y nocturno, según los
// umbrales configurables dayStart/dayEnd (sección 7 del Reto 02: clave para
// el dimensionamiento de paneles -horas de sol- y del banco de baterías -horas sin sol-).
function energyByPeriod(profile, dayStart, dayEnd){
  let diurnalW = 0, nocturnalW = 0;
  for(let h=0;h<24;h++){
    const inDay = dayStart<dayEnd ? (h>=dayStart && h<dayEnd) : (h>=dayStart || h<dayEnd);
    if(inDay) diurnalW += profile[h]; else nocturnalW += profile[h];
  }
  return { diurnal: diurnalW/1000, nocturnal: nocturnalW/1000 };
}

function monthlyEnergy(ed, opDaysMonth){ return ed * opDaysMonth; }
function annualEnergy(ed, opDaysYear){ return ed * opDaysYear; }

function costs(ed, em, ea, unitCost){
  return { daily: ed*unitCost, monthly: em*unitCost, annual: ea*unitCost };
}

// Clasificación diurna/nocturna/mixta según horario y umbrales día/noche configurables
function classifyLoad(load, dayStart, dayEnd){
  const hrs = activeHours(load);
  if(hrs.length===0) return 'sin-horario';
  let hasDay=false, hasNight=false;
  for(const h of hrs){
    const inDay = dayStart<dayEnd ? (h>=dayStart && h<dayEnd) : (h>=dayStart || h<dayEnd);
    if(inDay) hasDay=true; else hasNight=true;
  }
  if(hasDay && hasNight) return 'mixta';
  return hasDay ? 'diurna' : 'nocturna';
}

function loadEnergyDaily(load){ // kWh/día de una carga individual
  return HOURS.reduce((s,h)=> s + loadPowerAtHour(load,h), 0) / 1000;
}
function loadAvgFu(load){
  const hrs = activeHours(load);
  if(hrs.length===0) return 0;
  return hrs.reduce((s,h)=> s + effectiveFu(load,h), 0) / hrs.length;
}
function loadMaxFu(load){ const hrs=activeHours(load); return hrs.length? Math.max(...hrs.map(h=>effectiveFu(load,h))) : 0; }
function loadMinFu(load){ const hrs=activeHours(load); return hrs.length? Math.min(...hrs.map(h=>effectiveFu(load,h))) : 0; }

// Verificación de coherencia matemática interna (sección 37)
function runConsistencyChecks(loads){
  const issues=[];
  const pinst = installedPower(loads);
  const profile = hourlyProfile(loads);
  const pmax = maxDemand(profile);
  const ed = dailyEnergy(profile);
  const sumCheck = profile.reduce((a,b)=>a+b,0)/1000;
  if(Math.abs(sumCheck-ed) > 1e-9) issues.push('Discrepancia entre perfil horario y energía diaria.');
  if(pmax.value - pinst > 1e-6) issues.push('La demanda máxima excede la potencia instalada: revisar factores de utilización.');
  return issues;
}

/* ============================ VALIDACIÓN ================================ */
function validateLoad(l){
  const errs = {};
  if(!l.description || !l.description.trim()) errs.description = 'La descripción es obligatoria.';
  if(!(l.quantity>0)) errs.quantity = 'La cantidad debe ser un número mayor que 0.';
  if(!(l.unitPower>0)) errs.unitPower = 'La potencia unitaria debe ser mayor que 0 W.';
  if(l.schedule.length===0) errs.schedule = 'Agrega al menos un intervalo horario de funcionamiento.';
  for(const iv of l.schedule){
    if(iv.start===iv.end) { errs.schedule = 'Un intervalo no puede tener la misma hora de inicio y fin.'; break; }
  }
  // solapamientos entre intervalos de la misma carga
  if(!errs.schedule && l.schedule.length>1){
    const activeSet = new Set();
    for(const iv of l.schedule){
      for(const h of HOURS){
        const inIv = iv.end>iv.start ? (h>=iv.start&&h<iv.end) : (h>=iv.start||h<iv.end);
        if(inIv){
          if(activeSet.has(h)){ errs.schedule = 'Existen intervalos horarios que se solapan entre sí.'; break; }
          activeSet.add(h);
        }
      }
      if(errs.schedule) break;
    }
  }
  return errs;
}
// Detecta si otra carga del proyecto tiene exactamente la misma descripción,
// potencia unitaria y horario de funcionamiento (RF-09).
function findDuplicateLoad(l, allLoads, excludeId){
  const normDesc = (l.description||'').trim().toLowerCase();
  const myHours = JSON.stringify(activeHours(l));
  for(const other of allLoads){
    if(other.id===excludeId) continue;
    const otherDesc = (other.description||'').trim().toLowerCase();
    if(otherDesc !== normDesc) continue;
    if(Number(other.unitPower) !== Number(l.unitPower)) continue;
    if(JSON.stringify(activeHours(other)) !== myHours) continue;
    return other;
  }
  return null;
}
function validateProject(p){
  const errs = {};
  if(!p.name || !p.name.trim()) errs.name = 'El nombre del proyecto es obligatorio.';
  if(!p.id || !p.id.trim()) errs.id = 'El ID del proyecto es obligatorio.';
  if(!(p.opDaysPerMonth>0 && p.opDaysPerMonth<=31)) errs.opDaysPerMonth = 'Días de operación al mes debe estar entre 1 y 31.';
  if(!(p.opDaysPerYear>0 && p.opDaysPerYear<=366)) errs.opDaysPerYear = 'Días de operación al año debe estar entre 1 y 366.';
  if(!(p.unitCost>=0)) errs.unitCost = 'El costo unitario no puede ser negativo.';
  if(!(p.dayStart>=0 && p.dayStart<=23)) errs.dayStart = 'La hora de inicio diurno debe estar entre 0 y 23.';
  if(!(p.dayEnd>=0 && p.dayEnd<=23)) errs.dayEnd = 'La hora de inicio nocturno debe estar entre 0 y 23.';
  return errs;
}

/* ============================ FORMATO ==================================== */
// Un valor no numérico o infinito (p. ej. una división por una entrada en cero) se muestra
// como "—" y no como 0, para no presentar un resultado inválido como si fuera real.
const fmt = (n, d=2) => (typeof n==='number' && isFinite(n) ? n.toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d}) : '—');
const fmtInt = (n) => (typeof n==='number' && isFinite(n) ? Math.round(n).toLocaleString('es-CO') : '—');
const hh = (h) => String(h).padStart(2,'0')+':00';
const money = (n) => '$ ' + fmt(n,2);

function toast(msg, type='success'){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

/* ============================ RETO 02: GENERADOR FOTOVOLTAICO ==================
   Módulo de dimensionamiento del generador FV. Hereda automáticamente del
   Reto 01 (RF-13): Ed, P(h), Pmax y su hora, tipo de aplicación y días de
   operación — ninguno de estos datos se vuelve a pedir al usuario aquí.
   ================================================================================= */

/* ------------------------------- Estado del Reto 02 ------------------------------ */
function defaultVmaxForAppType(appType){
  // Restricción de voltaje típica según el tipo de sistema (editable por el usuario).
  switch(appType){
    case 'off-grid': return 150;          // controlador de carga MPPT típico
    case 'hibrido-offgrid': return 250;   // controlador de carga de mayor rango
    case 'on-grid': return 600;           // inversor de conexión a red típico (BT)
    case 'hibrido-ongrid': return 600;
    default: return 600;
  }
}
// RF-18: PR justificado según el tipo de aplicación (off-grid castiga más por
// las pérdidas del banco de baterías y el controlador de carga).
function defaultPRForAppType(appType){
  switch(appType){
    case 'off-grid': return 0.70;
    case 'hibrido-offgrid': return 0.72;
    case 'on-grid': return 0.80;
    case 'hibrido-ongrid': return 0.78;
    default: return 0.75;
  }
}
function prJustificationText(appType){
  switch(appType){
    case 'off-grid': return 'Off-grid: pérdidas de cableado, temperatura, suciedad y controlador de carga MPPT, más el rendimiento de carga/descarga del banco de baterías (round-trip típico 85–95%).';
    case 'hibrido-offgrid': return 'Híbrido off-grid: pérdidas similares a off-grid, algo menores por una gestión más eficiente del inversor/cargador combinado.';
    case 'on-grid': return 'On-grid: solo pérdidas de cableado, temperatura, suciedad e inversor de conexión a red — no hay pérdidas de banco de baterías.';
    case 'hibrido-ongrid': return 'Híbrido on-grid: pérdidas de inversor y cableado similares a on-grid, más una pequeña pérdida adicional por el banco de baterías de respaldo.';
    default: return 'Valor típico de referencia.';
  }
}
function newGenState(){
  const appType = state ? state.appType : 'off-grid';
  return {
    lat: 11.240, lon: -74.199,
    tilt: 11, azimuth: 180,
    casoGuardadoId: 'santa_marta',
    recurso: null,            // {fuente:'api'|'local', hspMensual:[12], hspAnual, casoNombre, consultadoEn, tilt, azimuth, detalle}
    criterioHSP: 'anual',     // 'anual' | 'min'
    cargandoAPI: false,
    PR: defaultPRForAppType(appType),
    vMaxSistema: defaultVmaxForAppType(appType),
    tAmbMin: 10,
    tAmbOperacion: 25,
    areaDisponible: 50,
    ventanaInicio: 6, ventanaFin: 18,   // RF-17: ventana solar configurable (06:00-18:00 por defecto)
    criterioSeleccion: 'menorExcedente', // RF-23: 'menorExcedente' | 'menorModulos' | 'menorArea'
    panelSeleccionadoId: null,
    seleccionAutomatica: true,
    // Módulos en SERIE adicionales (por encima del mínimo ns que exige la potencia pico,
    // RF-19/RF-20) que la selección AUTOMÁTICA puede sumar — sin tocar el número de cadenas
    // en paralelo, de modo que la corriente del arreglo no cambia — cuando eso es lo que
    // falta para que exista un inversor comercial que "cumple" (no solo "alerta") en la
    // rama sin almacenamiento. Siempre queda acotado por nsMax (la Voc máxima del sistema).
    // Nunca aplica a una selección manual ni al caso de prueba estandarizado — ahí siempre
    // vale 0 y la cadena es exactamente la mínima del TdR.
    panelNsExtra: 0,
    // Si el usuario edita manualmente PR o la tensión máxima del sistema, estas banderas
    // evitan que un cambio posterior de "Tipo de aplicación" (Proyecto) les pise el valor;
    // mientras sigan en false, ambos campos se recalculan a su valor típico (RF-16/RF-18)
    // cada vez que cambia el tipo de aplicación, para que el arreglo/la ventana de tensión
    // nunca queden "congelados" con los valores del tipo de aplicación anterior.
    prManual: false,
    vMaxManual: false,
    overrideCasoPrueba: null, // si está activo, sustituye Ed/P(h)/Pmax heredados por el caso estandarizado del ToR
    mostrarCuadroCargas: false, // RF-13: alterna el cuadro de cargas heredado del Reto 01
    mostrarTablaPerfil: false,  // RF-13: alterna la tabla de 24 valores P(h) heredados del Reto 01
  };
}
let genState = newGenState();
let pvwattsCache = {}; // caché por sesión, clave "lat,lon,tilt,azimuth"

/* --------------------------- Datos heredados del Reto 01 (RF-13) ------------------ */
// Perfil sintético del caso de prueba estandarizado del Reto 02 (Anexo 7.1 del ToR):
// Ed=7.580 kWh/día, dentro de ventana 06-18h=5.180 kWh, fuera=2.400 kWh, Pmax=910W a las 17:00.
function casoPruebaProfile(){
  const profile = Array(24).fill(0);
  const dia = (5180-910)/11; // 11 horas (06-16) + hora pico 17 = 5180 Wh
  for(let h=6; h<=16; h++) profile[h] = dia;
  profile[17] = 910;
  const noche = 2400/12; // 12 horas restantes (18-23, 00-05)
  for(let h=18; h<24; h++) profile[h] = noche;
  for(let h=0; h<6; h++) profile[h] = noche;
  return profile;
}
function activarCasoPrueba(){
  const profile = casoPruebaProfile();
  genState.overrideCasoPrueba = {
    ed: 7.580, profile, pmaxW: 910, pmaxHour: 17,
  };
  genState.lat = 12.18; genState.lon = -71.28; genState.tilt = 12; genState.azimuth = 180;
  genState.casoGuardadoId = 'uribia';
  // PR y tensión máxima son datos declarados por el TdR: se marcan como fijados para que un
  // cambio posterior del tipo de aplicación no los reemplace por los valores típicos.
  genState.PR = 0.70; genState.prManual = true;
  genState.vMaxSistema = 600; genState.vMaxManual = true;
  genState.tAmbMin = 20; genState.tAmbOperacion = 32;
  genState.areaDisponible = 20;
  genState.ventanaInicio = 6; genState.ventanaFin = 18;
  genState.recurso = null; genState.panelSeleccionadoId = null; genState.seleccionAutomatica = true; genState.panelNsExtra = 0;
}
function desactivarCasoPrueba(){
  genState.overrideCasoPrueba = null;
}
function getInheritedData(){
  if(genState.overrideCasoPrueba){
    const o = genState.overrideCasoPrueba;
    return {
      ed:o.ed, profile:o.profile, pmaxW:o.pmaxW, pmaxHour:o.pmaxHour,
      appType: state.appType, opDaysPerMonth: state.opDaysPerMonth, opDaysPerYear: state.opDaysPerYear,
      esVerificacion: true
    };
  }
  const loads = state.loads;
  const profile = hourlyProfile(loads);
  const pmax = maxDemand(profile);
  const ed = dailyEnergy(profile);
  return {
    ed, profile, pmaxW: pmax.value, pmaxHour: pmax.hour,
    appType: state.appType, opDaysPerMonth: state.opDaysPerMonth, opDaysPerYear: state.opDaysPerYear,
    esVerificacion: false
  };
}

// RF-17: fracción de energía consumida dentro de la ventana solar (configurable, 06:00-18:00 por defecto)
function solarWindowSplit(profile){
  let inWindow = 0, total = 0;
  const ini = genState.ventanaInicio, fin = genState.ventanaFin;
  for(let h=0;h<24;h++){
    total += profile[h];
    const dentro = ini<fin ? (h>=ini && h<fin) : (h>=ini || h<fin);
    if(dentro) inWindow += profile[h];
  }
  return { dentroWh: inWindow, fueraWh: total-inWindow, fraccion: total>0 ? inWindow/total : 0 };
}

/* --------------------------------- Recurso solar ----------------------------------- */
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function nearestCasoGuardado(lat, lon){
  const casos = (window.BASE_DATOS_SOLAR && window.BASE_DATOS_SOLAR.casos) || [];
  if(casos.length===0) return null;
  let best = casos[0], bestD = haversineKm(lat,lon,casos[0].lat,casos[0].lon);
  for(const c of casos.slice(1)){
    const d = haversineKm(lat,lon,c.lat,c.lon);
    if(d<bestD){ bestD=d; best=c; }
  }
  return best;
}
function localFallbackRecurso(lat, lon, detalle){
  const caso = nearestCasoGuardado(lat, lon);
  if(!caso){
    return { fuente:'local', hspMensual:Array(12).fill(4.5), hspAnual:4.5, casoNombre:'(sin datos locales)', detalle: detalle||'Sin conexión y sin casos locales disponibles.' };
  }
  return recursoDesdeCaso(caso, detalle);
}
// Recurso solar tomado tal cual de un caso de la base de datos local (sin consultar la API).
function recursoDesdeCaso(caso, detalle){
  const hspAnual = caso.hspAnual!=null ? caso.hspAnual : (caso.hspMensual.reduce((a,b)=>a+b,0)/12);
  return {
    fuente:'local', hspMensual: caso.hspMensual.slice(), hspAnual, casoNombre: caso.nombre,
    tilt: caso.tilt, azimuth: caso.azimuth,
    fuenteTexto: caso.fuente || (window.BASE_DATOS_SOLAR && window.BASE_DATOS_SOLAR.fuente) || 'Base de datos local',
    detalle: detalle || 'Consulta a PVWatts no disponible.',
    consultadoEn: caso.fechaConsulta ? (caso.fechaConsulta+'T00:00:00') : new Date().toISOString()
  };
}
async function fetchConTiempoLimite(url, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{ return await fetch(url, { method:'GET', signal: controller.signal }); }
  finally { clearTimeout(timer); }
}
async function fetchPVWatts(lat, lon, tilt, azimuth){
  const key = `${lat.toFixed(3)},${lon.toFixed(3)},${tilt},${azimuth}`;
  if(pvwattsCache[key]) return pvwattsCache[key];
  if(!window.CONFIG){
    throw new Error('window.CONFIG no está definido (config.js no se cargó correctamente).');
  }
  const d = window.CONFIG.PVWATTS_DEFAULTS || {};
  const params = new URLSearchParams({
    lat: String(lat), lon: String(lon),
    system_capacity: String(d.system_capacity ?? 4),
    tilt: String(tilt), azimuth: String(azimuth),
    array_type: String(d.array_type ?? 1),
    module_type: String(d.module_type ?? 0),
    losses: String(d.losses ?? 14.08),
  });
  const timeoutMs = window.CONFIG.PVWATTS_TIMEOUT_MS || 30000;
  // 1) En Vercel, la función /api/pvwatts agrega la clave personal desde la variable de
  //    entorno NREL_API_KEY: la clave nunca está en el repositorio ni en el navegador.
  // 2) Si esa función no existe (archivo abierto con file://, servidor local) o no tiene
  //    clave configurada, se consulta la API directamente con window.CONFIG.API_KEY
  //    (DEMO_KEY, la clave pública de NREL; developer.nlr.gov acepta CORS desde cualquier origen).
  let resp = null;
  if(location.protocol.startsWith('http')){
    try{
      const r = await fetchConTiempoLimite(`api/pvwatts?${params}`, timeoutMs);
      if(r.status!==404 && r.status!==503) resp = r;
    } catch(err){
      if(err.name==='AbortError') throw new Error('Tiempo de espera agotado consultando PVWatts.');
    }
  }
  if(!resp){
    if(!window.CONFIG.API_KEY) throw new Error('window.CONFIG.API_KEY no está definido en config.js.');
    params.set('api_key', window.CONFIG.API_KEY);
    try{
      resp = await fetchConTiempoLimite(`${window.CONFIG.PVWATTS_BASE_URL}?${params}`, timeoutMs);
    } catch(err){
      throw new Error(err.name==='AbortError' ? 'Tiempo de espera agotado consultando PVWatts.' : ('Error de red: '+err.message));
    }
  }
  if(!resp.ok){
    throw new Error(`PVWatts respondió con código HTTP ${resp.status}.`);
  }
  let data;
  try{ data = await resp.json(); } catch(err){ throw new Error('La respuesta de PVWatts no es JSON válido.'); }
  if(data.errors && data.errors.length){
    throw new Error('PVWatts devolvió un error: ' + data.errors.join('; '));
  }
  if(!data.outputs || !Array.isArray(data.outputs.solrad_monthly)){
    throw new Error('La respuesta de PVWatts no contiene datos de irradiación (solrad_monthly).');
  }
  const hspMensual = data.outputs.solrad_monthly.map(v=>Number(v)||0);
  const hspAnual = Number(data.outputs.solrad_annual) || (hspMensual.reduce((a,b)=>a+b,0)/12);
  // PVWatts no devuelve el municipio fuera de EE. UU. (city suele venir vacío), pero sí el
  // departamento/estado y el país de la celda NSRDB usada: se guardan como respaldo del nombre.
  const st = data.station_info || {};
  const ubicacionApi = [st.city, st.state, st.country].filter(Boolean).join(', ') || null;
  const result = {
    fuente:'api', hspMensual, hspAnual, tilt, azimuth,
    casoNombre: `Lat ${lat.toFixed(3)}, Lon ${lon.toFixed(3)} (PVWatts/NSRDB)`,
    ubicacion: ubicacionApi,
    distanciaCeldaKm: st.distance!=null ? Number(st.distance)/1000 : null,
    consultadoEn: new Date().toISOString()
  };
  pvwattsCache[key] = result;
  return result;
}
// Nombre del lugar consultado ("Municipio, Departamento, País") por geocodificación inversa
// de OpenStreetMap (Nominatim): sirve para cualquier coordenada, sin clave de API. Si falla,
// devuelve null y se usa el departamento/país que reporta PVWatts.
async function fetchNombreUbicacion(lat, lon){
  const params = new URLSearchParams({ format:'jsonv2', lat:String(lat), lon:String(lon), zoom:'10', 'accept-language':'es' });
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 8000);
  try{
    const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?${params}`, { signal: controller.signal });
    if(!resp.ok) return null;
    const data = await resp.json();
    const a = data.address || {};
    const municipio = a.city || a.town || a.village || a.municipality || a.county || null;
    const completo = [municipio, a.state, a.country].filter(Boolean).join(', ');
    return completo ? { ciudad: municipio || a.state || a.country, completo } : null;
  } catch(err){
    return null;
  } finally {
    clearTimeout(timer);
  }
}
async function consultarRecursoSolar(){
  // Con un caso guardado seleccionado se usan sus datos de la base local tal cual, sin
  // consultar la API; la API solo se consulta con "Coordenadas manuales".
  const casoSel = genState.casoGuardadoId
    ? ((window.BASE_DATOS_SOLAR && window.BASE_DATOS_SOLAR.casos) || []).find(c=>c.id===genState.casoGuardadoId)
    : null;
  if(casoSel){
    genState.recurso = Object.assign(recursoDesdeCaso(casoSel, null), { seleccionado:true, ubicacion: casoSel.nombre });
    toast(`Recurso solar tomado de la base de datos local (${casoSel.nombre}).`, 'success');
    reabrirSeleccionTrasRecurso();
    render();
    return;
  }
  genState.cargandoAPI = true;
  render();
  try{
    const lat = genState.lat, lon = genState.lon;
    const [r, nombre] = await Promise.all([
      fetchPVWatts(lat, lon, genState.tilt, genState.azimuth),
      fetchNombreUbicacion(lat, lon),
    ]);
    genState.recurso = Object.assign({}, r, {
      ubicacion: nombre ? nombre.completo : r.ubicacion,
      ciudad: nombre ? nombre.ciudad : r.ubicacion,
    });
    toast(`Recurso solar obtenido desde la API de PVWatts${genState.recurso.ubicacion?` para ${genState.recurso.ubicacion}`:''}.`, 'success');
  } catch(err){
    genState.recurso = localFallbackRecurso(genState.lat, genState.lon, err.message);
    toast('No se pudo consultar PVWatts (' + err.message + '). Se usaron datos locales de respaldo.', 'error');
  } finally {
    genState.cargandoAPI = false;
    reabrirSeleccionTrasRecurso();
    render();
  }
}
function reabrirSeleccionTrasRecurso(){
  genState.panelSeleccionadoId = null; genState.seleccionAutomatica = true; genState.panelNsExtra = 0;
  // El arreglo/potencia pico acaba de recalcularse: cualquier regulador/inversor/batería
  // ya elegido pudo quedar sin cumplir contra el nuevo arreglo. Se reabre la selección
  // automática (sin tocar una elección manual del usuario) para que Regulador/Baterías
  // vuelva a buscar equipo+batería que cumplan, en la rama que corresponda.
  if(bancState){
    if(bancState.seleccionReguladorAutomatica) bancState.reguladorId = null;
    if(bancState.seleccionInversorAutomatica) bancState.inversorId = null;
    if(bancState.seleccionBateriaAutomatica) bancState.bateriaId = null;
    bancState.ajusteMsg = null; bancState.configuracionImposible = null;
  }
}
function hspSeleccionado(){
  if(!genState.recurso) return null;
  const m = genState.recurso.hspMensual;
  if(genState.criterioHSP==='anual'){
    return { valor: genState.recurso.hspAnual, etiqueta: 'Promedio anual' };
  }
  let idx=0; for(let i=1;i<12;i++) if(m[i]<m[idx]) idx=i;
  const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return { valor: m[idx], etiqueta: `Mes de menor recurso (${MESES[idx]})`, mesIdx: idx };
}

/* ------------------------------- Potencia pico (RF-18) ---------------------------- */
function computePpicoW(){
  const ed = getInheritedData().ed;
  const hsp = hspSeleccionado();
  if(!hsp || hsp.valor<=0 || genState.PR<=0) return null;
  const ppicoKW = ed / (hsp.valor * genState.PR);
  return ppicoKW * 1000; // W
}

/* --------------------- Configuración en cadenas por panel (RF-19..22) ------------- */
// nsExtra: módulos en SERIE adicionales por encima del mínimo ns que exige la potencia
// pico (ver genState.panelNsExtra arriba), acotado por nsMax. Al aumentar ns (y recalcular
// np hacia abajo para mantener el total de módulos cerca del mínimo necesario) sube la Voc/Vmp
// del arreglo SIN aumentar su corriente — útil para que el arreglo entre en la ventana MPPT
// de un inversor sin violar sus límites de Imp/Isc. Vale 0 en todos los usos "de catálogo"
// (tabla de referencias, caso de prueba, selección manual) y solo puede ser > 0 cuando la
// selección automática del panel/arreglo lo fija explícitamente (RF-23 extendido).
function computePanelConfig(panel, ppicoW, nsExtra){
  // RF-20: corrección térmica de Voc a la temperatura ambiente mínima de diseño
  // (NTC 2050 art. 690-7): Voc_gen = Nserie x Voc_STC x [1 + beta x (Tmin-25)]
  const vocFrio = panel.voc * (1 + (panel.betaVocPct/100) * (genState.tAmbMin - 25));
  // Temperatura de celda en operación (modelo NOCT, G=1000 W/m²):
  // Tcelda = Tamb + (NOCT-20) x (G/800)
  const tCelda = genState.tAmbOperacion + (panel.noct-20) * (1000/800);
  // Vmp en operación: se aplica el mismo coeficiente beta (no se publica un
  // coeficiente de Vmp independiente en la mayoría de fichas técnicas).
  const vmpOperacion = panel.vmp * (1 + (panel.betaVocPct/100) * (tCelda - 25));

  const nsMax = Math.floor(genState.vMaxSistema / vocFrio);
  const descartado = nsMax < 1;
  if(descartado){
    return { panel, vocFrio, vmpOperacion, tCelda, nsMax:0, ns:0, np:0, totalModulos:0,
      descartado:true, motivo:`La Voc corregida en frío (${fmt(vocFrio,2)} V) ya supera la tensión máxima del sistema (${fmt(genState.vMaxSistema,2)} V) con un solo módulo en la cadena.` };
  }
  const modulosNecesarios = ppicoW!=null ? Math.max(1, Math.ceil(ppicoW / panel.pMax)) : 0;
  const nsBase = Math.max(1, Math.min(nsMax, modulosNecesarios || nsMax));
  // nsExtra puede ser negativo (menos módulos en serie, más cadenas en paralelo —
  // baja la tensión del arreglo) o positivo (más módulos en serie, menos cadenas en
  // paralelo — sube la tensión sin subir la corriente); siempre acotado a [1, nsMax].
  const ns = Math.max(1, Math.min(nsMax, nsBase + (nsExtra||0)));
  const np = modulosNecesarios ? Math.ceil(modulosNecesarios / ns) : 0;
  const totalModulos = ns*np;
  const potenciaInstaladaW = totalModulos*panel.pMax;

  // RF-21: Isc del generador y corriente de diseño (NTC 2050 art. 690-8: 1.25 x 1.25 x Isc_gen)
  const corrienteArregloA = np*panel.isc;           // Isc del generador (todas las cadenas en paralelo)
  const corrienteDisenoA = 1.25*1.25*corrienteArregloA;

  // RF-22: área ocupada (campo directo del catálogo, en m² por módulo)
  const areaOcupadaM2 = totalModulos*panel.areaM2;

  // Energía diaria estimada que el generador puede producir con el HSP y PR usados
  const hsp = hspSeleccionado();
  const energiaGeneradaKWh = hsp ? (potenciaInstaladaW/1000)*hsp.valor*genState.PR : null;

  // Comprobación cruzada: potencia operativa estimada a Tcelda usando el coeficiente de potencia (gamma)
  const potenciaOperativaW = (panel.gammaPmpPct!=null)
    ? potenciaInstaladaW*(1 + (panel.gammaPmpPct/100)*(tCelda-25))
    : null;

  return {
    panel, vocFrio, vmpOperacion, tCelda, nsMax, ns, np, nsBase, nsExtra:(ns-nsBase), totalModulos, potenciaInstaladaW,
    corrienteDisenoA, corrienteArregloA, areaOcupadaM2, descartado:false,
    vocTotalStringV: ns*vocFrio, energiaGeneradaKWh, potenciaOperativaW,
  };
}

// Comprueba si, para un arreglo candidato (gen = {panel,cfg,ppicoW}), existe
// en el catálogo del Reto 03 al menos un equipo con veredicto "cumple"
// — se usan las mismas funciones de evaluación (RF-28 a RF-31) que ya
// pinta la pestaña Regulador/Baterías, así que el resultado es idéntico al
// que vería el usuario en esa pestaña.
function existeReguladorQueCumple(gen){
  return (window.CATALOGO_REGULADORES||[]).some(e => evaluarRegulador(gen,e).veredicto==='cumple');
}
function existeInversorQueCumple(gen){
  return (window.CATALOGO_INVERSORES||[]).some(e => evaluarInversor(gen,e).veredicto==='cumple');
}

// Máximo de módulos en SERIE que la selección automática puede sumar o quitar
// respecto del mínimo necesario (siempre acotado además por nsMax —la Voc máxima
// del sistema— y por 1 módulo como mínimo), buscando que la rama activa (y, de
// ser posible, también la otra) tenga un equipo que "cumple" en el catálogo del
// Reto 03. Subir Ns (y bajar Np en la misma proporción) sube la tensión del
// arreglo sin subir su corriente — ayuda cuando falta llegar a la ventana MPPT
// de un inversor. Bajar Ns (y subir Np) baja la tensión — ayuda cuando el
// arreglo supera la tensión máxima de entrada de los reguladores del catálogo.
const MAX_NS_DELTA_AUTO = 6;

// RF-23: criterio explícito de selección automática entre las referencias viables
function autoSelectPanelId(ppicoW, ramaObjetivoOverride){
  // La selección automática (RF-23) sigue dejando elegir el criterio
  // explícito (menor excedente / menor número de módulos / menor área),
  // pero ese criterio ahora se aplica dentro del grupo de referencias que
  // además entregan una configuración completa y válida: se prioriza el
  // panel/arreglo para el cual YA exista, en el catálogo del Reto 03, al
  // menos un equipo que "cumple" tanto en la rama CON almacenamiento
  // (regulador) como en la rama SIN almacenamiento (inversor), de modo que
  // cambiar de rama en "Regulador/Baterías" siempre tenga una selección
  // automática válida que mostrar, sin tocar nada manualmente.
  //
  // Para lograrlo también se permite "recalcular" el arreglo: si con la
  // forma mínima de la cadena (el Ns/Np que exige la potencia pico, RF-19/
  // RF-20) ningún equipo del catálogo cumple en alguna rama, se prueban
  // hasta ±MAX_NS_DELTA_AUTO módulos en serie — recalculando Np en la
  // proporción inversa, de modo que el número total de módulos (y por
  // tanto la potencia instalada) casi no cambia — hasta encontrar la
  // combinación serie/paralelo que haga aparecer un equipo que cumple,
  // probando primero los cambios más pequeños, sin superar nunca nsMax
  // (Voc máxima) ni el área disponible declarada. Esto solo ocurre en la
  // selección AUTOMÁTICA: una selección manual o el caso de prueba
  // estandarizado siempre usan exactamente la cadena mínima del TdR (0).
  const catalogoCompleto = window.CATALOGO_PANELES || [];
  const scoreFn = (cfg)=>{
    if(genState.criterioSeleccion==='menorModulos') return cfg.totalModulos;
    if(genState.criterioSeleccion==='menorArea') return cfg.areaOcupadaM2;
    // 'menorExcedente', 'conAlmacenamiento' y 'sinAlmacenamiento' comparten el mismo
    // criterio de desempate (menor excedente/déficit); las dos últimas solo cambian
    // CUÁL rama se prioriza al calcular el "tier" de viabilidad, más abajo.
    return Math.abs(cfg.potenciaInstaladaW - ppicoW);
  };
  // Orden de pruebas: 0, +1, -1, +2, -2, ... — siempre el menor cambio primero.
  const deltas = [0];
  for(let k=1; k<=MAX_NS_DELTA_AUTO; k++){ deltas.push(k); deltas.push(-k); }
  const mejorNsDeltaPara = (p)=>{
    // Para un panel dado, prueba los deltas en orden de menor a mayor
    // magnitud y se queda con el primero que alcanza el mejor nivel de
    // viabilidad (tier) visto para ese panel.
    let mejor = null;
    const nsVistos = new Set();
    for(const delta of deltas){
      const cfg = computePanelConfig(p, ppicoW, delta);
      if(cfg.descartado) continue;
      if(nsVistos.has(cfg.ns)) continue; // ya se probó este mismo Ns (tope en nsMax o en 1)
      nsVistos.add(cfg.ns);
      if(genState.areaDisponible>0 && cfg.areaOcupadaM2 > genState.areaDisponible) continue; // no exceder el área declarada
      const gen = { panel: p, cfg, ppicoW };
      const viableCon = existeReguladorQueCumple(gen);
      const viableSin = existeInversorQueCumple(gen);
      // La rama que se prioriza pesa el doble en el "tier": de nada sirve que la rama
      // que casi no se va a usar "cumpla" si la que realmente se necesita no lo hace.
      // Por defecto, SIEMPRE se prioriza CON ALMACENAMIENTO (regulador + batería),
      // independientemente del tipo de aplicación y de cuál rama esté actualmente
      // abierta/seleccionada en la pestaña Regulador/Baterías — así una nueva consulta
      // de recurso solar, un cambio de carga, etc. siempre busca primero un arreglo que
      // admita algún equipo+batería con almacenamiento. La única forma de invertir esa
      // prioridad es que el propio criterio RF-23 pida explícitamente lo contrario
      // ('sinAlmacenamiento' → prioriza inversor; 'conAlmacenamiento' → confirma la
      // prioridad por defecto). "menorExcedente"/"menorModulos"/"menorArea" NO cambian
      // la prioridad: siguen usando con-almacenamiento como rama principal.
      // ramaObjetivoOverride permite forzar cuál rama se prioriza (usado por el botón
      // "Ajustar automáticamente" de Regulador/Baterías para apuntar siempre a la rama
      // ACTUALMENTE activa, sin depender del criterio RF-23 de Generador FV). Si ninguna
      // rama se fuerza explícitamente, la coherencia física rama↔tipo de aplicación manda
      // sobre el criterio RF-23: On-grid jamás usa banco de baterías (prioriza inversor) y
      // Off-grid/híbrido off-grid jamás entregan a la red sin baterías (priorizan regulador),
      // sin importar qué diga el criterio; solo en los tipos donde ambas ramas son válidas
      // (híbrido on-grid) decide el criterio explícito RF-23 ('sinAlmacenamiento' invierte
      // la prioridad por defecto hacia el inversor).
      const ramaActivaEsCon = ramaObjetivoOverride ? (ramaObjetivoOverride==='con-almacenamiento')
        : ramaConAlmacenamientoDeshabilitada(state.appType) ? false
        : ramaSinAlmacenamientoDeshabilitada(state.appType) ? true
        : (genState.criterioSeleccion !== 'sinAlmacenamiento');
      const viablePrincipal = ramaActivaEsCon ? viableCon : viableSin;
      const viableSecundaria = ramaActivaEsCon ? viableSin : viableCon;
      const tier = (viablePrincipal ? 0 : 2) + (viableSecundaria ? 0 : 1);
      const candidato = { p, cfg, delta, viableCon, viableSin, viableObjetivo: viablePrincipal, tier, score: scoreFn(cfg) };
      if(!mejor || tier < mejor.tier) mejor = candidato;
      if(tier===0) break; // ya no se puede mejorar más
    }
    return mejor;
  };
  const evaluar = (lista)=> lista
    .map(p => mejorNsDeltaPara(p))
    .filter(x => x!=null);
  const mejor = (lista)=>{
    if(lista.length===0) return null;
    return [...lista].sort((a,b)=> (a.tier-b.tier) || (a.score-b.score) || (Math.abs(a.delta)-Math.abs(b.delta)))[0];
  };
  const comerciales = evaluar(catalogoCompleto.filter(p => !p.esReferenciaNoComercial));
  const todos = evaluar(catalogoCompleto);
  const mejorComercial = mejor(comerciales);
  const mejorTodos = mejor(todos);
  const elegido = (!mejorComercial) ? mejorTodos
    : (mejorComercial.tier===0) ? mejorComercial // ya cumple en ambas ramas con equipo comercial
    : (mejorTodos && mejorTodos.tier < mejorComercial.tier) ? mejorTodos // el de referencia realmente mejora la viabilidad
    : mejorComercial;
  if(!elegido) return null;
  return { id: elegido.p.id, nsExtra: elegido.delta, viableObjetivo: elegido.viableObjetivo };
}
const CRITERIO_SELECCION_LABELS = {
  menorExcedente: 'Menor excedente/déficit frente a la potencia pico',

  // para que la selección automática de panel, regulador/inversor y batería coincida

  conAlmacenamiento: 'Con almacenamiento (priorizar regulador y batería)',

};

// RF-24: validación de entradas y advertencias de resultados fuera de rango razonable
// Rangos estrictos de validación de los campos del módulo Generador FV (item 7).
// Los límites "min"/"max" se aplican por recorte (clamp) duro; "minExclusive"
// exige un valor estrictamente mayor que el indicado (no solo >=).
const GEN_FIELD_RANGES = {
  lat: { min:-90, max:90, label:'Latitud' },
  lon: { min:-180, max:180, label:'Longitud' },
  azimuth: { min:-180, max:180, label:'Azimut' },
  ventanaInicio: { min:0, max:23, label:'Ventana solar — inicio' },
  ventanaFin: { min:0, max:23, label:'Ventana solar — fin' },
  PR: { min:0, max:1, label:'Factor global de desempeño (PR)' },
  vMaxSistema: { minExclusive:0, label:'Tensión máxima del sistema' },
  areaDisponible: { minExclusive:0, label:'Área disponible' },
};
// Recorta (clamp) el valor de un campo de genState a su rango válido.
// Devuelve {value, corregido} — "corregido" indica si el valor de entrada
// estaba fuera de rango y tuvo que ajustarse.
function clampGenFieldValue(key, value){
  const r = GEN_FIELD_RANGES[key];
  if(!r) return { value, corregido:false };
  let v = value;
  let corregido = false;
  if(r.minExclusive!=null && !(v > r.minExclusive)){
    v = r.minExclusive + (key==='vMaxSistema' ? 1 : 0.1); // mínimo positivo simbólico
    corregido = true;
  }
  if(r.min!=null && v < r.min){ v = r.min; corregido = true; }
  if(r.max!=null && v > r.max){ v = r.max; corregido = true; }
  return { value:v, corregido, label:r.label };
}

function validarEntradasGenerador(hsp, ppicoW){
  const warns = [];
  if(genState.PR<=0 || genState.PR>1) warns.push('El factor de desempeño (PR) debe estar entre 0 y 1.');
  else if(genState.PR<0.5 || genState.PR>0.95) warns.push(`PR = ${fmt(genState.PR,2)} está fuera del rango típico razonable (0,50–0,95); verifica el valor.`);
  if(hsp && (hsp.valor<2 || hsp.valor>7.5)) warns.push(`El HSP utilizado (${fmt(hsp.valor,2)} kWh/m²·día) está fuera del rango físicamente plausible para Colombia (2–7,5); verifica la ubicación o la fuente de datos.`);
  if(genState.tAmbMin>=genState.tAmbOperacion) warns.push('La temperatura ambiente mínima debería ser menor que la temperatura de operación declarada.');
  if(genState.vMaxSistema<=0) warns.push('La tensión máxima del sistema debe ser mayor que 0 V.');
  if(genState.areaDisponible<=0) warns.push('El área disponible debe ser mayor que 0 m².');
  if(ppicoW!=null){
    const inh = getInheritedData();
    if(inh.pmaxW>0 && (ppicoW < inh.pmaxW*0.3 || ppicoW > inh.pmaxW*40)){
      warns.push(`La potencia pico calculada (${fmt(ppicoW/1000,2)} kWp) luce desproporcionada frente a la demanda máxima heredada (${fmt(inh.pmaxW/1000,2)} kW); revisa HSP y PR.`);
    }
  }
  return warns;
}
