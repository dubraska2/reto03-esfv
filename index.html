        }
      });
    }
  }
}

/* ============================ MODAL DE CONFIRMACIÓN (propio, sin depender de window.confirm) ============================ */
let confirmState = null; // {title, message, danger, resolve}
function showConfirm(title, message, opts={}){
  return new Promise((resolve)=>{
    confirmState = { title, message, danger: !!opts.danger, confirmLabel: opts.confirmLabel||'Confirmar', resolve };
    renderConfirmModal();
  });
}
function renderConfirmModal(){
  let el = document.getElementById('confirmOverlay');
  if(!confirmState){ if(el) el.remove(); return; }
  const html = `
  <div class="modal-overlay" id="confirmOverlay" style="z-index:200;">
    <div class="modal" style="max-width:420px;">
      <div class="modal-header"><h3>${escapeHtml(confirmState.title)}</h3></div>
      <div class="modal-body" style="padding-top:16px;">
        <p style="color:var(--text-dim);font-size:13px;line-height:1.5;">${escapeHtml(confirmState.message)}</p>
      </div>
      <div class="modal-footer" style="justify-content:flex-end;">
        <button class="btn btn-ghost" id="confirmCancelBtn">Cancelar</button>
        <button class="btn ${confirmState.danger?'btn-danger':'btn-primary'}" id="confirmOkBtn" ${confirmState.danger?'style="background:var(--danger);border-color:var(--danger);color:#fff;"':''}>${escapeHtml(confirmState.confirmLabel)}</button>
      </div>
    </div>
  </div>`;
  if(el) el.outerHTML = html; else document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('confirmCancelBtn').addEventListener('click', ()=> resolveConfirm(false));
  document.getElementById('confirmOkBtn').addEventListener('click', ()=> resolveConfirm(true));
  document.getElementById('confirmOverlay').addEventListener('click', (e)=>{ if(e.target.id==='confirmOverlay') resolveConfirm(false); });
}
function resolveConfirm(val){
  const r = confirmState && confirmState.resolve;
  confirmState = null;
  document.getElementById('confirmOverlay')?.remove();
  if(r) r(val);
}

/* ============================ PERSISTENCIA ====================================== */
function serializeProject(){ return JSON.stringify({ _type:'ESFV_PROJECT', _version:2, project: state, generador: genState, banco: bancState }, null, 2); }
function saveProjectToFile(){
  const errs = validateProject(state);
  if(Object.keys(errs).length){ activeTab='proyecto'; render(); toast('Completa los datos obligatorios del proyecto antes de guardar.','error'); return; }
  const blob = new Blob([serializeProject()], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${(state.id||'proyecto').replace(/[^a-z0-9_-]/gi,'_')}_ESFV.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  dirty = false; savedOnce = true;
  toast('Proyecto guardado correctamente.','success');
  render();
}
function loadProjectFromFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      const proj = parsed.project || parsed; // tolerante a formato plano
      if(!proj || !Array.isArray(proj.loads)) throw new Error('Formato inválido');
      // reconstrucción con valores por defecto por si faltan campos
      state = Object.assign(newProject(), proj);
      state.loads = proj.loads.map((l,i)=> Object.assign(newLoad(i+1), l));
      dirty = false; savedOnce = true;
      selectedLoadId=null; selectedHour=null; activeTab='proyecto';
      fuSelectedLoads = new Set(state.loads.map(l=>l.id));
      genState = Object.assign(newGenState(), parsed.generador||{});
      bancState = Object.assign(newBancState(), parsed.banco||{});
      aplicarRestriccionRamaPorAppType(); // un proyecto guardado antes de este cambio podría traer "sin almacenamiento" para off-grid
      render();
      toast('Proyecto cargado correctamente.','success');
    }catch(err){
      toast('No se pudo cargar el archivo: formato inválido.','error');
    }
  };
  reader.readAsText(file);
}
function handleNewProject(){
  const doNew = ()=>{
    state = newProject();
    dirty=false; savedOnce=false; selectedLoadId=null; selectedHour=null; activeTab='proyecto';
    fuSelectedLoads = new Set();
    genState = newGenState();
    bancState = newBancState();
    render();
    toast('Nuevo proyecto iniciado.','success');
  };
  if(dirty){
    showConfirm('Descartar cambios', 'Existen cambios sin guardar. ¿Deseas continuar y descartar el proyecto actual? Esta acción no se puede deshacer.', {danger:true, confirmLabel:'Descartar y continuar'})
      .then(ok=>{ if(ok) doNew(); });
    return;
  }
  doNew();
}
function handleDemoReset(){
  const doReset = ()=>{
    state = buildDemoProject();
    dirty=false; savedOnce=false; selectedLoadId=null; selectedHour=null;
    fuSelectedLoads = new Set(state.loads.map(l=>l.id));
    genState = newGenState();
    bancState = newBancState();
    render();
    toast('Datos de demostración restaurados.','success');
  };
  if(dirty){
    showConfirm('Restaurar demostración', 'Se restaurará el proyecto de demostración y se perderán los cambios actuales. ¿Continuar?', {danger:true, confirmLabel:'Restaurar'})
      .then(ok=>{ if(ok) doReset(); });
    return;
  }
  doReset();
}

/* ============================ EVENTOS ============================================ */
function attachRootEvents(){
  const app = document.getElementById('app');

  // header
  app.querySelector('#btnNew')?.addEventListener('click', handleNewProject);
  app.querySelector('#btnSave')?.addEventListener('click', saveProjectToFile);
  app.querySelector('#btnLoad')?.addEventListener('click', ()=> document.getElementById('fileLoadInput').click());
  app.querySelector('#btnReport')?.addEventListener('click', ()=>{
    if(state.loads.length===0){
      toast('No se puede generar el informe: el cuadro de cargas está vacío. Agrega al menos una carga primero.','error');
      activeTab='cargas'; render(); return;
    }
    activeTab='informe'; render();
  });

  // tabs
  app.querySelectorAll('.tab-btn').forEach(b=> b.addEventListener('click', ()=>{ activeTab=b.dataset.tab; selectedHour=null; render(); }));

  // ---- PROYECTO ----
  const bindProjectField = (key, parse=(v)=>v) => {
    const el = app.querySelector(`#pf-${key}`);
    if(el) el.addEventListener('input', ()=>{ state[key]=parse(el.value); markDirty(); refreshKpiOnly(); });
  };
  bindProjectField('name'); bindProjectField('id'); bindProjectField('members'); bindProjectField('date');
  bindProjectField('dayStart', v=>parseInt(v)||0);
  bindProjectField('dayEnd', v=>parseInt(v)||0);
  bindProjectField('opDaysPerMonth', v=>parseInt(v)||0);
  bindProjectField('opDaysPerYear', v=>parseInt(v)||0);
  // Costo unitario: manejo dedicado para actualizar el aviso en vivo (sin re-render completo,
  // lo que rompería la escritura continua) y mostrar una notificación al confirmar el valor en 0.
  const unitCostEl = app.querySelector('#pf-unitCost');
  if(unitCostEl){
    unitCostEl.addEventListener('input', ()=>{
      state.unitCost = parseFloat(unitCostEl.value)||0;
      markDirty(); refreshKpiOnly();
      const warnEl = document.getElementById('pf-unitCostWarningSlot');
      if(warnEl){
        if(Number(state.unitCost)===0){
          warnEl.innerHTML = '<span class="field-warning">⚠ Costo unitario en $0,00 — todos los costos (diario, mensual, anual) se calcularán como $0,00.</span>';
        } else {
          warnEl.innerHTML = '<span class="field-help">Valor editable — usado en el cálculo de costos.</span>';
        }
      }
    });
    unitCostEl.addEventListener('change', ()=>{
      if(Number(state.unitCost)===0){
        toast('Costo unitario configurado en $0,00: los costos diario, mensual y anual se calcularán como $0,00.', 'error');
      }
    });
  }
  // header name/id chip needs full render on blur to refresh chip text
  // Nota: el chip de nombre/ID del encabezado ya se mantiene sincronizado en vivo
  // mediante refreshKpiOnly() en cada 'input' (ver bindProjectField), por lo que
  // NO se dispara un render() completo en el blur — eso destruía en pleno vuelo
  // cualquier clic (p. ej. a otra pestaña) que el usuario hiciera justo después
  // de editar estos campos, ya que el blur se dispara antes que el click.

  app.querySelectorAll('[data-apptype]').forEach(c=> c.addEventListener('click', ()=>{
    state.appType = c.dataset.apptype;
    markDirty();
    // El tipo de aplicación fija los valores típicos de PR (RF-18) y de tensión máxima
    // del sistema (RF-16/RF-17): si el usuario no los editó a mano, se actualizan aquí;
    // de lo contrario, el arreglo del Generador FV quedaría calculado con la ventana de
    // tensión del tipo de aplicación ANTERIOR, lo que impide que encuentre un regulador/
    // inversor que cumpla con el nuevo tipo — y da la impresión de que nada cambia.
    if(!genState.vMaxManual) genState.vMaxSistema = defaultVmaxForAppType(state.appType);
    if(!genState.prManual) genState.PR = defaultPRForAppType(state.appType);
    // Si el criterio RF-23 explícito quedó fijado en una rama que ya no tiene sentido
    // físico para el nuevo tipo de aplicación, se vuelve al criterio por defecto.
    if((genState.criterioSeleccion==='sinAlmacenamiento' && ramaSinAlmacenamientoDeshabilitada(state.appType))
      || (genState.criterioSeleccion==='conAlmacenamiento' && ramaConAlmacenamientoDeshabilitada(state.appType))){
      genState.criterioSeleccion = 'menorExcedente';
    }
    // El arreglo puede cambiar de tamaño: se reabre la selección automática del panel y,
    // aguas abajo, la de regulador/inversor/batería, para que se revalide todo contra el
    // nuevo tipo de aplicación en vez de arrastrar la configuración anterior. Un panel
    // elegido a mano (o fijado por el caso de prueba) se conserva, igual que los equipos.
    if(genState.seleccionAutomatica){ genState.panelSeleccionadoId = null; genState.panelNsExtra = 0; }
    if(bancState){
      if(bancState.seleccionReguladorAutomatica) bancState.reguladorId = null;
      if(bancState.seleccionInversorAutomatica) bancState.inversorId = null;
      if(bancState.seleccionBateriaAutomatica) bancState.bateriaId = null;
      if(!bancState.ramaManual) bancState.rama = ramaSugerida(state.appType);
      aplicarRestriccionRamaPorAppType();
      bancState.ajusteMsg = null; bancState.configuracionImposible = null;
    }
    render();
  }));

  // ---- CARGAS ----
  app.querySelector('#btnAddLoad')?.addEventListener('click', ()=> openLoadModal(null));
  app.querySelector('#btnAddLoadEmpty')?.addEventListener('click', ()=> openLoadModal(null));
  app.querySelector('#btnDemoReset')?.addEventListener('click', handleDemoReset);
  app.querySelectorAll('[data-edit-load]').forEach(b=> b.addEventListener('click',(e)=>{ e.stopPropagation(); openLoadModal(b.dataset.editLoad); }));
  app.querySelectorAll('[data-dup-load]').forEach(b=> b.addEventListener('click',(e)=>{
    e.stopPropagation();
    const orig = state.loads.find(l=>l.id===b.dataset.dupLoad);
    const copy = JSON.parse(JSON.stringify(orig));
    copy.id = uid('C'); copy.code = 'C'+(state.loads.length+1); copy.description = orig.description + ' (copia)';
    state.loads.push(copy); markDirty(); toast('Carga duplicada.','success'); render();
  }));
  app.querySelectorAll('[data-del-load]').forEach(b=> b.addEventListener('click',(e)=>{
    e.stopPropagation();
    const id = b.dataset.delLoad;
    showConfirm('Eliminar carga', '¿Eliminar esta carga? Esta acción no se puede deshacer.', {danger:true, confirmLabel:'Eliminar'}).then(ok=>{
      if(!ok) return;
      state.loads = state.loads.filter(l=>l.id!==id);
      if(selectedLoadId===id) selectedLoadId=null;
      markDirty(); toast('Carga eliminada.','success'); render();
    });
  }));
  app.querySelectorAll('[data-select-load]').forEach(r=> r.addEventListener('click', ()=>{
    selectedLoadId = (selectedLoadId===r.dataset.selectLoad) ? null : r.dataset.selectLoad;
    render();
  }));

  // ---- ANÁLISIS ----
  app.querySelectorAll('[data-chart]').forEach(b=> b.addEventListener('click', ()=>{ activeChart=b.dataset.chart; selectedHour=null; render(); }));
  app.querySelector('#btnToggleHeatmap')?.addEventListener('click', ()=>{ heatmapExpanded=!heatmapExpanded; render(); });
  app.querySelectorAll('[data-fu-toggle]').forEach(cb=> cb.addEventListener('change', ()=>{
    if(cb.checked) fuSelectedLoads.add(cb.dataset.fuToggle); else fuSelectedLoads.delete(cb.dataset.fuToggle);
    renderActiveChart();
  }));

  // ---- GENERADOR FV (Reto 02) ----
  const bindGenField = (id, key, parse=(v)=>v) => {
    const el = app.querySelector(`#${id}`);
    if(!el) return;
    el.addEventListener('input', ()=>{ genState[key]=parse(el.value); });
    el.addEventListener('change', ()=>{
      // item 7: recorte estricto a rango válido + notificación si el valor se ajustó
      const chk = clampGenFieldValue(key, genState[key]);
      if(chk.corregido){
        genState[key] = chk.value;
        toast(`"${chk.label}" estaba fuera del rango permitido y se ajustó automáticamente a ${fmt(chk.value,2)}.`, 'error');
      }
      render();
    });
  };
  // Escribir una coordenada a mano deja de corresponder a un caso guardado.
  bindGenField('gf-lat','lat', v=>{ genState.casoGuardadoId = ''; return parseFloat(v)||0; });
  bindGenField('gf-lon','lon', v=>{ genState.casoGuardadoId = ''; return parseFloat(v)||0; });
  bindGenField('gf-tilt','tilt', v=>parseFloat(v)||0);
  bindGenField('gf-azimuth','azimuth', v=>parseFloat(v)||0);
  bindGenField('gf-ventIni','ventanaInicio', v=>parseInt(v)||0);
  bindGenField('gf-ventFin','ventanaFin', v=>parseInt(v)||0);
  bindGenField('gf-PR','PR', v=>parseFloat(v)||0);
  app.querySelector('#gf-PR')?.addEventListener('change', ()=>{ genState.prManual = true; });
  bindGenField('gf-vMax','vMaxSistema', v=>parseFloat(v)||0);
  app.querySelector('#gf-vMax')?.addEventListener('change', ()=>{ genState.vMaxManual = true; });
  bindGenField('gf-tMin','tAmbMin', v=>parseFloat(v)||0);
  bindGenField('gf-tOp','tAmbOperacion', v=>parseFloat(v)||0);
  bindGenField('gf-area','areaDisponible', v=>parseFloat(v)||0);

  app.querySelector('#gf-casoGuardado')?.addEventListener('change', (e)=>{
    const id = e.target.value;
    genState.casoGuardadoId = id;
    if(id){
      const caso = (window.BASE_DATOS_SOLAR?.casos||[]).find(c=>c.id===id);
      if(caso){ genState.lat = caso.lat; genState.lon = caso.lon; genState.tilt = caso.tilt; genState.azimuth = caso.azimuth; }

  });
  app.querySelector('#gf-criterioHSP')?.addEventListener('change', (e)=>{ genState.criterioHSP = e.target.value; render(); });
  app.querySelector('#gf-criterioSeleccion')?.addEventListener('change', (e)=>{
    genState.criterioSeleccion = e.target.value;
    genState.panelSeleccionadoId = null; genState.seleccionAutomatica = true; genState.panelNsExtra = 0;
    // Si se elige explícitamente "Con almacenamiento" o "Sin almacenamiento", esa rama
    // manda sobre cualquier elección manual previa en "Regulador/Baterías": se vuelve a
    // dejar la rama (y el equipo/batería) en modo automático para que coincida.
    if(e.target.value==='conAlmacenamiento' || e.target.value==='sinAlmacenamiento'){
      bancState.ramaManual = false;
      bancState.reguladorId = null; bancState.seleccionReguladorAutomatica = true;
      bancState.inversorId = null; bancState.seleccionInversorAutomatica = true;
      bancState.bateriaId = null; bancState.seleccionBateriaAutomatica = true;
    }
    render();
  });
  app.querySelector('#btnConsultarSolar')?.addEventListener('click', consultarRecursoSolar);
  app.querySelectorAll('[data-select-panel]').forEach(b=> b.addEventListener('click', ()=>{
    genState.panelSeleccionadoId = b.dataset.selectPanel;
    genState.seleccionAutomatica = false;
    genState.panelNsExtra = 0; // una selección manual siempre usa la cadena mínima del TdR
    // El arreglo cambió: se reabre la selección automática de equipo/batería que siga en
    // modo automático para que se revalide contra el panel recién elegido.
    if(bancState.seleccionReguladorAutomatica) bancState.reguladorId = null;
    if(bancState.seleccionInversorAutomatica) bancState.inversorId = null;
    if(bancState.seleccionBateriaAutomatica) bancState.bateriaId = null;
    bancState.ajusteMsg = null; bancState.configuracionImposible = null;
    render();
  }));
  app.querySelector('#btnVolverSeleccionAutomatica')?.addEventListener('click', ()=>{
    genState.panelSeleccionadoId = null; genState.seleccionAutomatica = true;
    genState.panelNsExtra = 0; // se recalcula en el siguiente render vía autoSelectPanelId
    // El arreglo va a cambiar: se reabre la selección automática de equipo/batería que
    // siga en modo automático para que se revalide contra el nuevo arreglo.
    if(bancState.seleccionReguladorAutomatica) bancState.reguladorId = null;
    if(bancState.seleccionInversorAutomatica) bancState.inversorId = null;
    if(bancState.seleccionBateriaAutomatica) bancState.bateriaId = null;
    bancState.ajusteMsg = null; bancState.configuracionImposible = null;
    render();
  });
  app.querySelector('#btnActivarCasoPrueba')?.addEventListener('click', ()=>{ activarCasoPrueba(); render(); toast('Caso de prueba estandarizado cargado (verificación).','success'); });
  app.querySelector('#btnActivarCasoPruebaEmpty')?.addEventListener('click', ()=>{ activarCasoPrueba(); render(); toast('Caso de prueba estandarizado cargado (verificación).','success'); });
  app.querySelector('#btnDesactivarCasoPrueba')?.addEventListener('click', ()=>{ desactivarCasoPrueba(); render(); toast('Se restauraron los datos del proyecto del Reto 01.','success'); });
  app.querySelector('#btnToggleTablaPerfil')?.addEventListener('click', ()=>{ genState.mostrarTablaPerfil = !genState.mostrarTablaPerfil; render(); });
  app.querySelector('#btnToggleCuadroCargas')?.addEventListener('click', ()=>{ genState.mostrarCuadroCargas = !genState.mostrarCuadroCargas; render(); });

  // ---- RETO 03: REGULADOR/INVERSOR Y BANCO DE BATERÍAS ----
  app.querySelectorAll('[name="rama"]').forEach(r=> r.addEventListener('change', ()=>{
    // Defensa adicional: aunque el radio ya queda deshabilitado en el HTML para el tipo
    // de aplicación actual, se ignora igual cualquier intento de seleccionarlo por esa vía.
    if(r.value==='sin-almacenamiento' && ramaSinAlmacenamientoDeshabilitada(state.appType)){ render(); return; }
    if(r.value==='con-almacenamiento' && ramaConAlmacenamientoDeshabilitada(state.appType)){ render(); return; }
    bancState.rama = r.value; bancState.ramaManual = true;
    // Al cambiar de rama a mano, se refresca la selección automática de la rama recién
    // activada (si sigue en modo automático) contra el arreglo ACTUAL, en vez de arrastrar
    // un equipo que pudo quedar elegido para un arreglo anterior.
    if(bancState.rama==='con-almacenamiento'){
      if(bancState.seleccionReguladorAutomatica) bancState.reguladorId = null;
      if(bancState.seleccionBateriaAutomatica) bancState.bateriaId = null;
    } else {
      if(bancState.seleccionInversorAutomatica) bancState.inversorId = null;
    }
    bancState.ajusteMsg = null; bancState.configuracionImposible = null;
    render();
  }));
  const bindBancField = (id, key, parse=(v)=>v) => {
    const el = app.querySelector(`#${id}`);
    if(!el) return;
    el.addEventListener('input', ()=>{ bancState[key]=parse(el.value); });
    el.addEventListener('change', ()=>{ render(); });
  };
  bindBancField('bf-vBanco','tensionBancoV', v=>{ bancState.tensionBancoManual=true; return parseFloat(v)||0; });
  bindBancField('bf-dcacMin','dcAcMin', v=>parseFloat(v)||0);
  bindBancField('bf-dcacMax','dcAcMax', v=>parseFloat(v)||0);
  bindBancField('bf-etaInv','etaInversor', v=>parseFloat(v)||0);
  bindBancField('bf-autonomia','autonomiaDias', v=>parseFloat(v)||0);
  bindBancField('bf-dod','dodDisenoPct', v=>{ bancState.dodManual=true; return parseFloat(v)||0; });
  bindBancField('bf-factorTemp','factorTemp', v=>parseFloat(v)||0);
  app.querySelectorAll('[data-select-regulador]').forEach(b=> b.addEventListener('click', ()=>{
    bancState.reguladorId = b.dataset.selectRegulador; bancState.seleccionReguladorAutomatica=false; render();
  }));
  app.querySelectorAll('[data-select-inversor]').forEach(b=> b.addEventListener('click', ()=>{
    bancState.inversorId = b.dataset.selectInversor; bancState.seleccionInversorAutomatica=false; render();
  }));
  app.querySelectorAll('[data-select-bateria]').forEach(b=> b.addEventListener('click', ()=>{
    bancState.bateriaId = b.dataset.selectBateria; bancState.seleccionBateriaAutomatica=false;
    bancState.dodManual = false; // al cambiar de tecnología, vuelve a sugerir el DoD de fábrica de la nueva batería
    const bat = (window.CATALOGO_BATERIAS||[]).find(x=>x.id===bancState.bateriaId);
    if(bat && !bancState.tensionBancoManual){ bancState.tensionBancoV = defaultBankVoltageForBattery(bat); }
    render();
  }));
  app.querySelectorAll('[data-aplicar-reconfig]').forEach(b=> b.addEventListener('click', ()=>{
    const [tipo, id, ns] = b.dataset.aplicarReconfig.split('|');
    aplicarReconfiguracion(tipo, id, parseInt(ns,10)); render();
  }));
  app.querySelector('#btnAceptarAjusteBalance')?.addEventListener('click', ()=>{ aceptarAjusteBalance(); render(); });
  app.querySelector('#btnDeshacerAjusteBalance')?.addEventListener('click', ()=>{ deshacerAjusteBalance(); render(); });
  app.querySelector('#btnAjustarCumplir')?.addEventListener('click', ()=>{ ajustarParaCumplir(); render(); });
  app.querySelector('#btnActivarCasoPrueba3')?.addEventListener('click', ()=>{ activarCasoPruebaReto3(); render(); toast('Caso de prueba estandarizado del Reto 03 cargado (verificación).','success'); });
  app.querySelector('#btnActivarCasoPrueba3Empty')?.addEventListener('click', ()=>{ activarCasoPruebaReto3(); render(); toast('Caso de prueba estandarizado del Reto 03 cargado (verificación).','success'); });
  app.querySelector('#btnDesactivarCasoPrueba3')?.addEventListener('click', ()=>{ desactivarCasoPruebaReto3(); render(); toast('Se restauraron los datos del proyecto.','success'); });

  // ---- INFORME ----
  app.querySelector('#btnPrintReport')?.addEventListener('click', printReport);
  app.querySelector('#btnDownloadReport')?.addEventListener('click', downloadReport);
  app.querySelector('#btnGoToCargasFromInforme')?.addEventListener('click', ()=>{ activeTab='cargas'; render(); });

  // ---- file input (persistente, fuera de #app) ----
  const fileInput = document.getElementById('fileLoadInput');
  fileInput.onchange = (e)=>{ if(e.target.files[0]) loadProjectFromFile(e.target.files[0]); fileInput.value=''; };
}

function buildStandaloneReportDoc(){
  const printBar = `<div class="no-print" style="max-width:820px;margin:0 auto 14px;display:flex;justify-content:flex-end;">
    <button onclick="window.print()" style="padding:9px 16px;border-radius:6px;border:1px solid #ccc;background:#F5A623;color:#1a1206;font-weight:700;font-family:Arial,sans-serif;cursor:pointer;">🖶 Imprimir / Guardar como PDF</button>
  </div>`;
  return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Informe ESFV — ${escapeHtml(state.name)||'Proyecto'}</title>
  <style>${REPORT_STANDALONE_CSS}</style></head><body>${printBar}${buildReportHtml()}</body></html>`;
}
function downloadReport(){
  if(state.loads.length===0){
    toast('No se puede generar el informe: el cuadro de cargas está vacío. Agrega al menos una carga primero.','error');
    return;
  }
  const blob = new Blob([buildStandaloneReportDoc()], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Informe_${(state.id||'proyecto').replace(/[^a-z0-9_-]/gi,'_')}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Informe descargado. Ábrelo y usa Ctrl+P / Cmd+P para guardarlo como PDF.','success');
}
function printReport(){
  if(state.loads.length===0){
    toast('No se puede generar el informe: el cuadro de cargas está vacío. Agrega al menos una carga primero.','error');
    return;
  }
  try{
    window.print();
  }catch(err){
    toast('No se pudo abrir el diálogo de impresión aquí. Usa "Descargar informe" en su lugar.','error');
  }
}

/* ---------------------------- eventos del modal --------------------------------- */
function attachModalEvents(){
  const overlay = document.getElementById('loadModalOverlay');
  if(!overlay) return;
  const close = (e)=>{ if(e.target===overlay) closeLoadModal(); };
  overlay.addEventListener('click', close);
  document.getElementById('btnCloseModal')?.addEventListener('click', closeLoadModal);
  document.getElementById('btnCancelModal')?.addEventListener('click', closeLoadModal);

  const bindField = (id,key,parse=(v)=>v)=>{
    const el = document.getElementById(id);
    el?.addEventListener('input', ()=>{ modalDraft[key]=parse(el.value); });
  };
  bindField('lf-description','description');
  bindField('lf-quantity','quantity', v=>parseFloat(v)||0);
  bindField('lf-unitPower','unitPower', v=>parseFloat(v)||0);
  // Actualiza solo el texto derivado (potencia total) sin re-renderizar el modal completo,
  // para no perder el foco mientras el usuario escribe de forma continua.
  const updateDerivedTotals = ()=>{
    const ptotal = (modalDraft.quantity||0) * (modalDraft.unitPower||0);
    const totalEl = document.getElementById('modalPowerTotal');
    if(totalEl) totalEl.textContent = fmt(ptotal,2) + ' W';
  };
  document.getElementById('lf-quantity')?.addEventListener('input', updateDerivedTotals);
  document.getElementById('lf-unitPower')?.addEventListener('input', updateDerivedTotals);

  document.getElementById('btnAddInterval')?.addEventListener('click', ()=>{
    modalDraft.schedule.push({start:8,end:17});
    // inicializa Fu por defecto en 1 dentro del nuevo intervalo
    for(const h of HOURS) if(hourInSchedule(modalDraft,h) && (modalDraft.fu[h]===undefined)) modalDraft.fu[h]=1;
    softRenderModal();
  });
  document.querySelectorAll('[data-del-iv]').forEach(b=> b.addEventListener('click', ()=>{
    modalDraft.schedule.splice(parseInt(b.dataset.delIv),1); softRenderModal();
  }));
  document.querySelectorAll('[data-iv-idx]').forEach(sel=> sel.addEventListener('change', ()=>{
    const idx = parseInt(sel.dataset.ivIdx); const field = sel.dataset.ivField;
    modalDraft.schedule[idx][field] = parseInt(sel.value);
    softRenderModal();
  }));

  // Fu bars — click y arrastre para fijar valor (mousedown solo inicia el arrastre; el valor se fija en mousemove/click)
  document.querySelectorAll('[data-fu-hour]').forEach(track=>{
    const h = parseInt(track.dataset.fuHour);
    const setFromEvent = (evt)=>{
      if(track.dataset.fuActive!=='1') return;
      const rect = track.getBoundingClientRect();
      const y = (evt.touches? evt.touches[0].clientY : evt.clientY);
      let ratio = 1 - (y-rect.top)/rect.height;
      ratio = Math.min(1, Math.max(0, ratio));
      modalDraft.fu[h] = Math.round(ratio*20)/20; // pasos de 0.05
      softRenderModal();
    };
    track.addEventListener('mousedown', ()=>{ fuDragging=true; });
    track.addEventListener('mousemove', (e)=>{ if(fuDragging) setFromEvent(e); });
    track.addEventListener('click', setFromEvent);
  });

  document.getElementById('fuAll0')?.addEventListener('click', ()=>{ for(const h of HOURS) modalDraft.fu[h]=0; softRenderModal(); });
  document.getElementById('fuAll1')?.addEventListener('click', ()=>{ for(const h of HOURS) modalDraft.fu[h]=1; softRenderModal(); });
  document.getElementById('fuReset')?.addEventListener('click', ()=>{ for(const h of HOURS) modalDraft.fu[h]= hourInSchedule(modalDraft,h)?1:0; softRenderModal(); });
  document.getElementById('fuApplyToActive')?.addEventListener('click', ()=>{
    const v = Math.min(1,Math.max(0, parseFloat(document.getElementById('fuApplyValue').value)||0));
    for(const h of HOURS) if(hourInSchedule(modalDraft,h)) modalDraft.fu[h]=v;
    softRenderModal();
  });
  document.getElementById('fuToggleDetailed')?.addEventListener('click', ()=>{
    fuDetailedMode = !fuDetailedMode;
    softRenderModal();
  });
  document.querySelectorAll('[data-fu-exact]').forEach(inp=> inp.addEventListener('change', ()=>{
    const h = parseInt(inp.dataset.fuExact);
    let v = parseFloat(inp.value);
    if(isNaN(v)) v = 0;
    v = Math.min(1, Math.max(0, v));
    modalDraft.fu[h] = v;
    softRenderModal();
  }));

  document.getElementById('btnSaveLoad')?.addEventListener('click', ()=>{
    const errs = validateLoad(modalDraft);
    if(Object.keys(errs).length){ softRenderModal(); toast('Corrige los errores marcados antes de guardar la carga.','error'); return; }
    const dup = findDuplicateLoad(modalDraft, state.loads, editingLoadId);
    if(dup){
      toast(`Ya existe una carga (${dup.code}) con la misma descripción, potencia unitaria y horario. Ajusta alguno de estos datos para evitar duplicados.`, 'error');
      return;
    }
    if(editingLoadId){
      const idx = state.loads.findIndex(l=>l.id===editingLoadId);
      state.loads[idx] = modalDraft;
    } else {
      modalDraft.code = 'C'+(state.loads.length+1);
      state.loads.push(modalDraft);
      fuSelectedLoads.add(modalDraft.id);
    }
    markDirty();
    toast('Carga guardada correctamente.','success');
    closeLoadModal();
  });
  document.getElementById('btnDeleteFromModal')?.addEventListener('click', ()=>{
    showConfirm('Eliminar carga', '¿Eliminar esta carga? Esta acción no se puede deshacer.', {danger:true, confirmLabel:'Eliminar'}).then(ok=>{
      if(!ok) return;
      state.loads = state.loads.filter(l=>l.id!==editingLoadId);
      markDirty(); closeLoadModal();
    });
  });
}
// Re-renderiza sólo el contenido del modal (mantiene overlay) para reflejar cambios en vivo
function softRenderModal(){
  // Se difiere al siguiente tick para evitar reemplazar el DOM mientras un evento (change/blur)
  // todavía se está despachando sobre un elemento dentro del propio modal.
  setTimeout(()=>{
    const overlay = document.getElementById('loadModalOverlay');
    if(!overlay || !overlay.isConnected) return;
    overlay.outerHTML = renderLoadModal();
    attachModalEvents();
  }, 0);
}

/* ============================ ARRANQUE ============================================ */
window.addEventListener('error', (e)=>{
  const app = document.getElementById('app');
  if(app && !app.innerHTML.trim()){
    app.innerHTML = `<div style="padding:40px;font-family:sans-serif;color:#E9EEF4;background:#0E1217;min-height:100vh;">
      <h2 style="color:#F87171;">Ocurrió un error al iniciar el dashboard</h2>
      <p style="color:#8FA0B3;">${(e.message||'Error desconocido')}</p>
      <p style="color:#8FA0B3;font-size:12px;">Verifica que tu navegador tenga acceso a internet (fuentes de Google Fonts y Chart.js vía cdnjs.cloudflare.com) y recarga la página.</p>
    </div>`;
  }
});
function safeInit(){
  try{ init(); }
  catch(err){
    console.error(err);
    const app = document.getElementById('app');
    app.innerHTML = `<div style="padding:40px;font-family:sans-serif;color:#E9EEF4;background:#0E1217;min-height:100vh;">
      <h2 style="color:#F87171;">Ocurrió un error al iniciar el dashboard</h2>
      <p style="color:#8FA0B3;">${escapeHtml(err.message)}</p>
    </div>`;
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', safeInit);
} else {
  safeInit();
}
